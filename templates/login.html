<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員登入</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050b18;
    color:white;
    font-family:Arial,"Microsoft JhengHei";
}
.box{
    width:360px;
    padding:28px;
    border-radius:18px;
    background:#0b1b35;
    border:1px solid #1f7cff;
}
h1{text-align:center;color:#7ed0ff}
input,button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:10px;
    border:0;
    font-size:16px;
}
button{
    background:#007bff;
    color:white;
    font-weight:bold;
}
.msg{
    color:#ff6b86;
    text-align:center;
    margin-top:12px;
}
</style>
</head>
<body>

<div class="box">
    <h1>會員登入</h1>
    <input id="username" placeholder="帳號">
    <input id="password" type="password" placeholder="密碼">
    <button onclick="login()">登入</button>
    <div id="msg" class="msg"></div>
</div>

<script>
async function login(){
    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();

    const res=await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username,password})
    });

    const data=await res.json();

    if(!data.ok){
        document.getElementById("msg").textContent=data.msg || "登入失敗";
        return;
    }

    location.href="/";
}
</script>

</body>
</html>
