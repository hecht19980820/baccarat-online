<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員登入</title>
<style>
body{
background:#020817;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
width:350px;
background:#071226;
padding:30px;
border-radius:20px;
border:1px solid #16345f;
box-shadow:0 0 25px rgba(0,140,255,.2);
}
input{
width:100%;
padding:15px;
margin-top:15px;
background:#0b1730;
border:none;
border-radius:12px;
color:white;
font-size:16px;
}
button{
width:100%;
padding:15px;
margin-top:20px;
background:linear-gradient(90deg,#2563eb,#38bdf8);
border:none;
border-radius:14px;
color:white;
font-size:18px;
font-weight:bold;
}
</style>
</head>
<body>
<div class="box">
<h1>會員登入</h1>
<input id="username" placeholder="帳號">
<input id="password" type="password" placeholder="密碼">
<button onclick="login()">登入</button>
</div>
<script>
async function login(){
const username=document.getElementById('username').value
const password=document.getElementById('password').value

const r=await fetch('/api/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({username,password})
})

const data=await r.json()

if(data.ok){
location.href='/'
}else{
alert(data.msg)
}
}
</script>
</body>
</html>
