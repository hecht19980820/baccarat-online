<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員登入</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at top,#16345f 0%,#07111f 45%,#02050d 100%);
    font-family:Arial,"Microsoft JhengHei",sans-serif;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.line{
    position:absolute;
    width:200%;
    height:2px;
    background:linear-gradient(90deg,
        transparent,
        rgba(0,180,255,.8),
        transparent
    );
    animation:move 8s linear infinite;
    opacity:.35;
}

.line:nth-child(1){top:15%;animation-delay:0s}
.line:nth-child(2){top:35%;animation-delay:2s}
.line:nth-child(3){top:55%;animation-delay:4s}
.line:nth-child(4){top:75%;animation-delay:6s}

@keyframes move{
    from{
        transform:translateX(-50%);
    }
    to{
        transform:translateX(0%);
    }
}

.login-box{
    width:420px;
    max-width:92%;
    padding:36px;
    border-radius:22px;
    background:rgba(6,18,36,.88);
    border:1px solid rgba(0,180,255,.4);
    box-shadow:
        0 0 30px rgba(0,140,255,.25),
        inset 0 0 18px rgba(255,255,255,.03);
    backdrop-filter:blur(10px);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    margin:0;
    font-size:38px;
    letter-spacing:3px;
    color:#7ed0ff;
    text-shadow:0 0 15px rgba(0,180,255,.7);
}

.logo p{
    margin-top:10px;
    color:#9bbcff;
    font-size:14px;
    opacity:.8;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#9dccff;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#09182f;
    border:1px solid rgba(90,170,255,.3);
    color:white;
    font-size:16px;
    transition:.2s;
}

.input-group input:focus{
    border-color:#36b3ff;
    box-shadow:0 0 14px rgba(0,180,255,.35);
}

.login-btn{
    width:100%;
    height:56px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#005eff,#00a2ff);
    box-shadow:0 0 20px rgba(0,140,255,.4);
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 28px rgba(0,180,255,.55);
}

.msg{
    margin-top:15px;
    text-align:center;
    color:#ff7d95;
    min-height:20px;
    font-size:14px;
}

.footer{
    margin-top:22px;
    text-align:center;
    font-size:12px;
    color:#6f8bb6;
}

@media(max-width:760px){

    .login-box{
        padding:24px;
        border-radius:16px;
    }

    .logo h1{
        font-size:28px;
    }

    .login-btn{
        height:50px;
        font-size:16px;
    }

    .input-group input{
        padding:12px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
</div>

<div class="login-box">

    <div class="logo">
        <h1>百家樂 AI</h1>
        <p>BACCARAT AI PREDICTION SYSTEM</p>
    </div>

    <div class="input-group">
        <label>會員帳號</label>
        <input
            type="text"
            id="username"
            placeholder="請輸入帳號"
        >
    </div>

    <div class="input-group">
        <label>會員密碼</label>
        <input
            type="password"
            id="password"
            placeholder="請輸入密碼"
            onkeydown="if(event.key==='Enter'){login()}"
        >
    </div>

    <button class="login-btn" onclick="login()">
        進入系統
    </button>

    <div id="msg" class="msg"></div>

    <div class="footer">
        AI 智能分析系統 v3.2.1 PRO
    </div>

</div>

<script>

async function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(!username || !password){

        document.getElementById("msg").textContent =
            "請輸入帳號密碼";

        return;
    }

    const res = await fetch("/api/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            password
        })
    });

    const data = await res.json();

    if(!data.ok){

        document.getElementById("msg").textContent =
            data.msg || "登入失敗";

        return;
    }

    location.href = "/";
}

</script>

</body>
</html>
