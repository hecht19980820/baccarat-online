<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百家樂 AI 輔助分析系統</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --line:#0878d8;
    --blue:#0b7cff;
    --red:#ff174f;
    --green:#08a84d;
    --yellow:#ffd21f;
    --pink:#ff4db8;
    --text:#dbeafe;
}
html,body{
    min-height:100%;
    background:radial-gradient(circle at top,#071c34 0%,#020814 48%,#000 100%);
    color:var(--text);
    font-family:Arial,'Microsoft JhengHei',sans-serif;
}
body{padding:7px;overflow-x:hidden}
button,select,input{font-family:inherit}
button{cursor:pointer}
.app{
    width:100%;
    max-width:390px;
    margin:0 auto;
    padding-bottom:18px;
    transform-origin:top center;
}
.app.mobile-mode{
    max-width:360px;
}
.app.desktop-mode{
    max-width:760px;
}
.topbar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    align-items:center;
    margin-bottom:7px;
}
.select-wrap{
    position:relative;
    height:38px;
    border:1px solid var(--line);
    border-radius:7px;
    background:linear-gradient(180deg,#071a31,#030b18);
    box-shadow:0 0 9px rgba(0,132,255,.16),inset 0 0 10px rgba(0,132,255,.04);
    overflow:hidden;
}
.select-wrap:before{
    content:'♠';
    position:absolute;
    left:9px;
    top:7px;
    color:#9bc8ff;
    font-size:18px;
    z-index:1;
}
.select-wrap.version:before{content:'▣';font-size:15px;top:9px}
.select-wrap select{
    width:100%;
    height:100%;
    appearance:none;
    background:transparent;
    color:white;
    border:0;
    outline:0;
    font-size:15px;
    font-weight:800;
    padding:0 24px 0 33px;
}
.select-wrap:after{
    content:'⌄';
    position:absolute;
    right:8px;
    top:4px;
    font-size:24px;
    color:#b7d8ff;
    pointer-events:none;
}
.info-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    min-height:30px;
    align-items:center;
    border:1px solid rgba(143,182,223,.45);
    border-radius:7px;
    padding:4px 8px;
    margin-bottom:8px;
    background:linear-gradient(180deg,rgba(5,20,39,.72),rgba(3,12,25,.72));
    color:#d9eaff;
    font-size:12px;
    white-space:nowrap;
}
.info-left{overflow:hidden;text-overflow:ellipsis}
.info-right{text-align:right;overflow:hidden;text-overflow:ellipsis}
.info-icon{color:#9bc8ff;margin-right:2px}
.card{
    background:linear-gradient(180deg,rgba(5,20,39,.96),rgba(3,12,25,.96));
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 0 16px rgba(0,132,255,.14),inset 0 0 20px rgba(0,132,255,.03);
    padding:9px;
    margin-bottom:8px;
}
.card-title{
    font-size:18px;
    font-weight:900;
    color:#d8ebff;
    margin-bottom:7px;
    display:flex;
    align-items:center;
    gap:5px;
    line-height:1.15;
}
.card-title.spade:before{content:'♠';color:#b9dcff;font-size:20px}
.main-card{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:0;
    background:transparent;
    border:none;
    box-shadow:none;
}
.ai-panel{
    background:linear-gradient(180deg,rgba(5,20,39,.96),rgba(3,12,25,.96));
    border:1px solid var(--line);
    border-radius:9px;
    box-shadow:0 0 16px rgba(0,132,255,.14),inset 0 0 20px rgba(0,132,255,.03);
    padding:9px;
    min-height:132px;
    position:relative;
    overflow:hidden;
}
.ai-panel:before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 40% 52%,rgba(0,132,255,.13),transparent 44%);
    pointer-events:none;
}
.ai-title{
    position:relative;
    font-size:16px;
    font-weight:900;
    color:#d8ebff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
}
.ai-big{
    position:relative;
    text-align:center;
    margin-top:14px;
    color:var(--pink);
    font-size:41px;
    line-height:1;
    font-weight:1000;
    text-shadow:0 0 13px rgba(255,77,184,.8),0 0 28px rgba(255,77,184,.23);
}
.ai-rate{
    position:relative;
    text-align:center;
    margin-top:4px;
    color:var(--pink);
    font-size:22px;
    font-weight:900;
}
.alert-box{
    height:76px;
    border:1px solid #2a4766;
    border-radius:8px;
    background:linear-gradient(180deg,#07192c,#030b16);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    color:var(--yellow);
    font-size:16px;
    font-weight:900;
    margin-top:15px;
}
.road-card{padding:9px 9px 8px}
.road-grid{
    width:100%;
    height:140px;
    border:1px solid #203955;
    border-radius:7px;
    background:rgba(3,12,25,.55);
    display:grid;
    grid-template-rows:repeat(6,1fr);
    grid-auto-flow:column;
    grid-auto-columns:29px;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
}
.road-grid::-webkit-scrollbar{display:none}
.road-slot{
    border-right:1px solid rgba(143,182,223,.18);
    border-bottom:1px solid rgba(143,182,223,.18);
    display:flex;
    align-items:center;
    justify-content:center;
}
.road-chip{
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    background:#061426;
    line-height:1;
}
.road-chip.B{border:1.6px solid var(--red);color:#ffe0e7;box-shadow:0 0 5px rgba(255,23,79,.38)}
.road-chip.P{border:1.6px solid var(--blue);color:#d4e8ff;box-shadow:0 0 5px rgba(11,124,255,.38)}
.road-chip.T{border:1.6px solid var(--green);color:#d6ffe7;box-shadow:0 0 5px rgba(16,184,90,.38)}
.road-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:12px;
    margin-top:9px;
}
.action-btn{
    height:34px;
    border-radius:6px;
    border:1px solid #315070;
    color:white;
    font-size:21px;
    font-weight:900;
    background:#061426;
}
.action-btn.red{background:linear-gradient(180deg,#b60031,#690018);border-color:#ff174f;box-shadow:0 0 9px rgba(255,23,79,.15)}
.action-btn.blue{background:linear-gradient(180deg,#0056d4,#003071);border-color:#0b7cff;box-shadow:0 0 9px rgba(11,124,255,.15)}
.action-btn.green{background:linear-gradient(180deg,#00843e,#004e24);border-color:#10b85a;box-shadow:0 0 9px rgba(16,184,90,.15)}
.action-btn.undo{background:linear-gradient(180deg,#112238,#07111f);border-color:#315070;font-size:25px;color:#dcecff}
.card-input{padding:9px}
.input-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.input-note{font-size:13px;color:#b7cce7;white-space:nowrap}
.card-input-inner{border:1px solid #203955;border-radius:8px;background:rgba(3,12,25,.45);padding:8px}
.current-title{font-size:13px;color:#9fb9d8;margin-bottom:8px}
.current-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;min-height:39px;margin-bottom:9px}
.current-card{
    height:39px;
    border:1px solid #315070;
    border-radius:6px;
    background:#071426;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
    color:white;
}
.sequence{
    font-size:13px;
    color:#b9cae2;
    margin:7px 0 9px;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
}
.sequence::-webkit-scrollbar{display:none}
.sequence b:nth-child(1),.sequence b:nth-child(3){color:#0b7cff}
.sequence b:nth-child(2),.sequence b:nth-child(4){color:#ff174f}
.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}
.key{
    height:43px;
    border:1px solid #315070;
    border-radius:6px;
    background:linear-gradient(180deg,#122033,#08111f);
    color:white;
    font-size:25px;
    font-weight:800;
}
.key.clear{font-size:20px}
.key.submit{
    font-size:20px;
    background:linear-gradient(180deg,#957000,#5d4300);
    border-color:#d9a900;
}
.clear-table{
    height:42px;
    width:100%;
    border-radius:7px;
    border:1px solid #ff174f;
    background:linear-gradient(180deg,rgba(170,0,42,.95),rgba(65,0,18,.95));
    box-shadow:0 0 14px rgba(255,23,79,.22);
    color:#ffd8e2;
    font-size:18px;
    font-weight:900;
    margin-top:9px;
}
.app.desktop-mode .topbar{grid-template-columns:160px 160px 170px}
.app.desktop-mode .select-wrap{height:46px}
.app.desktop-mode .select-wrap select{font-size:20px}
.app.desktop-mode .info-row{font-size:15px;min-height:36px}
.app.desktop-mode .ai-panel{min-height:178px}
.app.desktop-mode .ai-title{font-size:21px}
.app.desktop-mode .ai-big{font-size:64px}
.app.desktop-mode .ai-rate{font-size:30px}
.app.desktop-mode .alert-box{height:105px;font-size:23px}
.app.desktop-mode .road-grid{height:190px;grid-auto-columns:39px}
.app.desktop-mode .road-chip{width:29px;height:29px;font-size:16px}
.app.desktop-mode .action-btn{height:43px;font-size:25px}
.app.desktop-mode .key{height:52px;font-size:29px}
.app.desktop-mode .current-card{height:52px}
.app.desktop-mode .current-cards{min-height:52px}
@media(max-width:380px){
    .app.mobile-mode{max-width:350px}
    .select-wrap select{font-size:14px;padding-left:31px}
    .road-grid{height:132px;grid-auto-columns:27px}
    .road-chip{width:20px;height:20px;font-size:11px}
    .key{height:41px}
}
</style>
</head>
<body>
<div class="app mobile-mode" id="app">
    <div class="topbar">
        <div class="select-wrap"><select id="platform" onchange="changePlatform()"><option value="DG">DG</option><option value="MT">MT</option></select></div>
        <div class="select-wrap"><select id="table" onchange="loadData()"></select></div>
        <div class="select-wrap version"><select id="viewMode" onchange="setViewMode(this.value)"><option value="mobile">手機版</option><option value="desktop">電腦版</option></select></div>
    </div>

    <div class="info-row">
        <div class="info-left"><span class="info-icon">👤</span>會員到期：<span id="memberExpire">-</span></div>
        <div class="info-right"><span class="info-icon">⟳</span>更新時間 <span id="updateTime">--:--:--</span></div>
    </div>

    <div class="main-card card">
        <div class="ai-panel">
            <div class="ai-title">♠ AI 建議方向</div>
            <div class="ai-big" id="aiSuggest">觀望</div>
            <div class="ai-rate" id="aiRate">0%</div>
        </div>
        <div class="ai-panel">
            <div class="ai-title">🔔 AI 提醒</div>
            <div class="alert-box" id="aiAlert">目前無提醒</div>
        </div>
    </div>

    <div class="card road-card">
        <div class="card-title spade">大路盤</div>
        <div class="road-grid" id="roadGrid"></div>
        <div class="road-actions">
            <button class="action-btn red" onclick="manualAdd('B')">莊</button>
            <button class="action-btn blue" onclick="manualAdd('P')">閒</button>
            <button class="action-btn green" onclick="manualAdd('T')">和</button>
            <button class="action-btn undo" onclick="undoLast()">↩</button>
        </div>
    </div>

    <div class="card card-input">
        <div class="input-head">
            <div class="card-title spade" style="margin-bottom:0">牌組輸入</div>
            <div class="input-note">最少 4 張，最多 6 張</div>
        </div>
        <div class="card-input-inner">
            <div class="current-title">目前輸入</div>
            <div class="current-cards" id="cardPreview">
                <div class="current-card"></div><div class="current-card"></div><div class="current-card"></div><div class="current-card"></div><div class="current-card"></div><div class="current-card"></div>
            </div>
            <div class="sequence">輸入順序： <b>閒1</b> → <b>莊1</b> → <b>閒2</b> → <b>莊2</b> → 第5張 → 第6張</div>
            <div class="keypad">
                <button class="key" onclick="addCard(1)">1</button>
                <button class="key" onclick="addCard(2)">2</button>
                <button class="key" onclick="addCard(3)">3</button>
                <button class="key" onclick="addCard(4)">4</button>
                <button class="key" onclick="addCard(5)">5</button>
                <button class="key" onclick="addCard(6)">6</button>
                <button class="key" onclick="addCard(7)">7</button>
                <button class="key" onclick="addCard(8)">8</button>
                <button class="key" onclick="addCard(9)">9</button>
                <button class="key clear" onclick="clearCards()">清除</button>
                <button class="key" onclick="addCard(0)">0</button>
                <button class="key submit" onclick="submitCards()">送出</button>
            </div>
        </div>
        <button class="clear-table" onclick="clearTableData()">🗑 清除此桌資料</button>
    </div>
</div>

<script>
let currentCards=[];
function shortResult(r){return r==='B'?'莊':r==='P'?'閒':r==='T'?'和':''}
function nowTime(){return new Date().toLocaleTimeString('zh-TW',{hour12:false})}
function setViewMode(mode){
    localStorage.setItem('viewMode',mode);
    const app=document.getElementById('app');
    app.classList.remove('mobile-mode','desktop-mode');
    app.classList.add(mode==='desktop'?'desktop-mode':'mobile-mode');
    document.body.style.padding = mode==='desktop' ? '10px' : '7px';
}
async function changePlatform(){
    const platform=document.getElementById('platform').value;
    const r=await fetch('/api/tables?platform='+platform);
    const tables=await r.json();
    const sel=document.getElementById('table');
    sel.innerHTML='';
    tables.forEach(t=>{const op=document.createElement('option');op.value=t;op.textContent=t;sel.appendChild(op)});
    await loadData();
}
function renderRoad(records){
    const box=document.getElementById('roadGrid');
    box.innerHTML='';
    const total=Math.max(90,(records||[]).length+18);
    for(let i=0;i<total;i++){
        const slot=document.createElement('div');
        slot.className='road-slot';
        const r=(records||[])[i];
        if(r){
            const chip=document.createElement('div');
            chip.className='road-chip '+r.result;
            chip.textContent=shortResult(r.result);
            slot.appendChild(chip);
        }
        box.appendChild(slot);
    }
}
function renderStats(data){
    const s=data.stats||{};
    document.getElementById('aiSuggest').textContent=s.suggest||'觀望';
    document.getElementById('aiRate').textContent=(s.stableRate||0)+'%';
    document.getElementById('aiAlert').textContent=(s.alerts&&s.alerts.length)?s.alerts[0]:'目前無提醒';
}
async function loadData(){
    const platform=document.getElementById('platform').value;
    const table=document.getElementById('table').value;
    if(!table)return;
    const r=await fetch(`/api/data?platform=${platform}&table=${table}`);
    const data=await r.json();
    if(!data.ok){location.href='/login';return;}
    document.getElementById('memberExpire').textContent=data.memberExpireTime||'-';
    document.getElementById('updateTime').textContent=nowTime();
    renderRoad(data.records||[]);
    renderStats(data);
}
async function manualAdd(result){
    const platform=document.getElementById('platform').value;
    const table=document.getElementById('table').value;
    const r=await fetch('/api/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,table,result})});
    const data=await r.json();
    if(!data.ok){alert(data.msg||'新增失敗');return;}
    await loadData();
}
async function undoLast(){
    const platform=document.getElementById('platform').value;
    const table=document.getElementById('table').value;
    await fetch('/api/undo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,table})});
    await loadData();
}
async function clearTableData(){
    if(!confirm('確定清除此桌資料？'))return;
    const platform=document.getElementById('platform').value;
    const table=document.getElementById('table').value;
    await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,table})});
    await loadData();
}
function addCard(n){if(currentCards.length>=6)return;currentCards.push(n);renderCardPreview()}
function clearCards(){currentCards=[];renderCardPreview()}
function renderCardPreview(){document.querySelectorAll('#cardPreview .current-card').forEach((c,i)=>c.textContent=currentCards[i]!==undefined?currentCards[i]:'')}
async function submitCards(){
    if(currentCards.length<4){alert('最少輸入 4 張');return;}
    const platform=document.getElementById('platform').value;
    const table=document.getElementById('table').value;
    const r=await fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform,table,cards:currentCards})});
    const data=await r.json();
    if(!data.ok){alert(data.msg||'牌型錯誤');return;}
    clearCards();await loadData();
}
const savedMode=localStorage.getItem('viewMode')||'mobile';
document.getElementById('viewMode').value=savedMode;
setViewMode(savedMode);
changePlatform();
setInterval(loadData,5000);
</script>
</body>
</html>
