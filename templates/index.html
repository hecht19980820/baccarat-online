<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百家樂 AI 系統</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
    radial-gradient(circle at top,#101f3d 0%,#050b18 48%,#02050d 100%);
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

.container{
    width:100%;
    max-width:1120px;
    margin:auto;
    padding:12px;
}

.topbar{
    display:grid;
    grid-template-columns:160px 160px 160px 1fr;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
}

select,button{
    width:100%;
    border-radius:12px;
    border:1px solid rgba(90,170,255,.45);
    background:#08162f;
    color:white;
    padding:12px;
    font-size:16px;
    font-weight:bold;
}

.expire{
    color:#ffd86b;
    font-size:16px;
    font-weight:bold;
    margin-bottom:12px;
}

.card{
    background:rgba(8,18,38,.82);
    border:1px solid rgba(80,160,255,.48);

    box-shadow:
        0 0 18px rgba(0,120,255,.18),
        inset 0 0 12px rgba(255,255,255,.025);

    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
}

.grid-top{
    display:grid;
    grid-template-columns:280px 1fr 260px;
    gap:12px;
}

.grid-mid{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:12px;
}

.title{
    color:#9dccff;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.ai-result{
    font-size:78px;
    font-weight:bold;
    text-align:center;
    margin:12px 0 8px;
    text-shadow:0 0 18px currentColor;
}

.banker-text{
    color:#ff4c5f;
}

.player-text{
    color:#2f8bff;
}

.wait-text{
    color:#ff5b8d;
}

.rate{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#ff9ec0;
}

.sub{
    color:#91a8d7;
    font-size:14px;
}

.center{
    text-align:center;
}

.road{

    display:grid;

    /* 一欄6顆 */
    grid-template-rows:repeat(6,43px);

    grid-auto-flow:column;

    grid-auto-columns:43px;

    gap:5px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:8px;

    border-radius:14px;

    background:rgba(255,255,255,.025);
}

.cell{
    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    font-size:18px;
}

.B{
    border:2px solid #ff3151;
    color:#ff3151;
    background:rgba(255,0,40,.18);
}

.P{
    border:2px solid #2f8bff;
    color:#2f8bff;
    background:rgba(0,90,255,.18);
}

.T{
    border:2px solid #00d26a;
    color:#00d26a;
    background:rgba(0,210,106,.18);
}

.alert-box{
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    background:rgba(255,255,255,.025);
    color:#ffd36a;
    font-size:16px;
}

.input-box{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:14px;
}

.hint{
    border:1px solid rgba(80,160,255,.35);
    border-radius:12px;
    padding:12px;
    color:#bcd8ff;
    line-height:1.8;
}

.card-preview{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.preview-wrap{
    text-align:center;
}

.preview-number{
    width:46px;
    height:46px;

    border-radius:8px;

    border:1px solid rgba(120,180,255,.48);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
    font-weight:bold;
}

.preview-label{
    margin-top:4px;
    font-size:12px;
    color:#91a8d7;
}

.preview-player .preview-number{
    border-color:#2f8bff;
}

.preview-banker .preview-number{
    border-color:#ff3151;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.keypad button{
    height:58px;
    font-size:24px;
}

.banker{
    background:linear-gradient(135deg,#9d0038,#ff2f71);
}

.player{
    background:linear-gradient(135deg,#0048d8,#009dff);
}

.tie{
    background:linear-gradient(135deg,#007a4c,#00d49a);
}

.warn{
    background:linear-gradient(135deg,#8d6200,#d39b00);
}

.danger{
    background:linear-gradient(135deg,#4b0018,#b00038);
}

.manual-buttons{
    display:grid;
    gap:14px;
    margin-top:25px;
}

.manual-buttons button{
    height:66px;
    font-size:28px;
}

.stats-row{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.stat-card{
    background:rgba(8,18,38,.82);
    border:1px solid rgba(80,160,255,.48);
    border-radius:14px;
    padding:14px;
}

.stat-title{
    color:#bceaff;
    font-size:16px;
}

.stat-value{
    margin-top:10px;
    font-size:30px;
    font-weight:bold;
}

.red-text{
    color:#ff3151;
}

.blue-text{
    color:#2f8bff;
}

.green-text{
    color:#00d26a;
}

.bottom-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

.bottom-buttons button{
    height:60px;
    font-size:22px;
}

.footer{
    opacity:.65;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    padding:14px;
    margin-top:12px;
}

/* 手機強制版 */

body.force-mobile .grid-top,
body.force-mobile .grid-mid,
body.force-mobile .input-box{
    grid-template-columns:1fr !important;
}

body.force-mobile .stats-row{
    grid-template-columns:repeat(3,1fr) !important;
}

body.force-mobile .road{
    grid-template-rows:repeat(6,34px) !important;
    grid-auto-columns:34px !important;
}

body.force-mobile .cell{
    width:32px !important;
    height:32px !important;
    font-size:14px !important;
}

body.force-mobile .ai-result{
    font-size:52px !important;
}

body.force-mobile .manual-buttons{
    grid-template-columns:repeat(3,1fr);
}

/* 手機自適應 */

@media(max-width:760px){

    body{
        overflow-x:hidden;
    }

    .container{
        padding:8px;
    }

    .topbar{
        grid-template-columns:1fr 1fr 1fr;
        gap:8px;
    }

    .grid-top,
    .grid-mid,
    .input-box{
        grid-template-columns:1fr;
    }

    .stats-row{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }

    .card{
        padding:10px;
    }

    .title{
        font-size:18px;
    }

    .ai-result{
        font-size:54px;
    }

    .rate{
        font-size:32px;
    }

    .road{
        grid-template-rows:repeat(6,34px);
        grid-auto-columns:34px;
    }

    .cell{
        width:32px;
        height:32px;
        font-size:14px;
    }

    .keypad button{
        height:52px;
        font-size:22px;
    }

    .manual-buttons{
        grid-template-columns:repeat(3,1fr);
    }

    .manual-buttons button{
        height:54px;
        font-size:22px;
    }

    .stat-title{
        font-size:13px;
    }

    .stat-value{
        font-size:22px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <select id="platform" onchange="loadTables()">
            <option value="DG">♠ DG</option>
            <option value="MT">♠ MT</option>
        </select>

        <select id="table" onchange="loadData()"></select>

        <select id="viewMode" onchange="changeViewMode()">
            <option value="auto">自動</option>
            <option value="mobile">手機版</option>
            <option value="desktop">電腦版</option>
        </select>

    </div>

    <div class="expire">
        會員到期時間：
        <span id="memberExpire">2025-06-30 23:59:59</span>
    </div>

    <div class="grid-top">

        <div class="card">

            <div class="title">
                ✦ AI 建議方向
            </div>

            <div id="suggest" class="ai-result wait-text">
                觀望
            </div>

            <div class="center sub">
                後台穩定率
            </div>

            <div id="stableRate" class="rate">
                0%
            </div>

        </div>

        <div class="card">

            <div class="title">
                ⚙ 大路盤
            </div>

            <div id="road" class="road"></div>

        </div>

        <div class="card">

            <div class="title">
                🔔 AI 提醒
            </div>

            <div id="alerts"></div>

        </div>

    </div>

    <div class="grid-mid">

        <div class="card">

            <div class="title">
                🎴 牌型輸入
            </div>

            <div class="input-box">

                <div>

                    <div class="hint">

                        固定輸入順序：<br>

                        閒1 → 莊1 → 閒2 → 莊2 → 閒3 → 莊3

                    </div>

                    <div class="sub" style="margin-top:12px;">
                        目前輸入
                    </div>

                    <div id="cardPreview" class="card-preview"></div>

                </div>

                <div>

                    <div class="keypad">

                        <button onclick="addCard(1)">1</button>
                        <button onclick="addCard(2)">2</button>
                        <button onclick="addCard(3)">3</button>

                        <button onclick="addCard(4)">4</button>
                        <button onclick="addCard(5)">5</button>
                        <button onclick="addCard(6)">6</button>

                        <button onclick="addCard(7)">7</button>
                        <button onclick="addCard(8)">8</button>
                        <button onclick="addCard(9)">9</button>

                        <button class="warn" onclick="resetCards()">
                            清除
                        </button>

                        <button onclick="addCard(0)">0</button>

                        <button class="banker" onclick="submitCards()">
                            送出
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="title">
                ♠ 手動添加大路結果
            </div>

            <div class="manual-buttons">

                <button class="banker" onclick="manualAdd('B')">
                    莊
                </button>

                <button class="player" onclick="manualAdd('P')">
                    閒
                </button>

                <button class="tie" onclick="manualAdd('T')">
                    和
                </button>

            </div>

        </div>

    </div>

    <div class="stats-row">

        <div class="stat-card">
            <div class="stat-title">莊勝率</div>
            <div id="bankerRate" class="stat-value red-text">0%</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">閒勝率</div>
            <div id="playerRate" class="stat-value blue-text">0%</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">和局數</div>
            <div id="tieRate" class="stat-value green-text">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">連續狀態</div>
            <div id="streak" class="stat-value red-text">-</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">下注次數</div>
            <div id="betCount" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">分析量</div>
            <div id="analysisCount" class="stat-value">0</div>
        </div>

    </div>

    <div class="bottom-buttons">

        <button onclick="undo()">
            ↩ 撤回上一筆
        </button>

        <button class="danger" onclick="clearTable()">
            🗑 清除此桌資料
        </button>

    </div>

    <div class="footer">

        <div>
            ♠ 百家樂 AI 系統
        </div>

        <div>
            Ver 2.3.0
        </div>

    </div>

</div>

<script>

let cards = [];

function changeViewMode(){

    const mode =
        document.getElementById("viewMode").value;

    document.body.classList.remove("force-mobile");
    document.body.classList.remove("force-desktop");

    if(mode === "mobile"){
        document.body.classList.add("force-mobile");
    }

}

async function loadTables(){

    const platform =
        document.getElementById("platform").value;

    const res =
        await fetch(`/api/tables?platform=${platform}`);

    const tables =
        await res.json();

    const tableSelect =
        document.getElementById("table");

    tableSelect.innerHTML = "";

    tables.forEach(t=>{

        const opt =
            document.createElement("option");

        opt.value = t;
        opt.textContent = t;

        tableSelect.appendChild(opt);

    });

    loadData();
}

async function loadData(){

    const platform =
        document.getElementById("platform").value;

    const table =
        document.getElementById("table").value;

    const res =
        await fetch(`/api/data?platform=${platform}&table=${table}`);

    const data =
        await res.json();

    if(data.memberExpireTime){

        document.getElementById("memberExpire").textContent =
            data.memberExpireTime;

    }

    renderRoad(data.records);

    renderStats(data);
}

function renderRoad(records){

    const road =
        document.getElementById("road");

    road.innerHTML = "";

    records.forEach(r=>{

        const div =
            document.createElement("div");

        div.className =
            `cell ${r.result}`;

        div.textContent =
            r.result === "B"
            ? "莊"
            : r.result === "P"
            ? "閒"
            : "和";

        road.appendChild(div);

    });

}

function renderStats(data){

    const s = data.stats;

    const suggest =
        document.getElementById("suggest");

    suggest.textContent =
        s.suggest;

    suggest.className =
        "ai-result";

    if(s.suggest === "莊"){

        suggest.classList.add("banker-text");

    }else if(s.suggest === "閒"){

        suggest.classList.add("player-text");

    }else{

        suggest.classList.add("wait-text");

    }

    document.getElementById("stableRate").textContent =
        s.stableRate + "%";

    document.getElementById("bankerRate").textContent =
        s.bankerRate + "%";

    document.getElementById("playerRate").textContent =
        s.playerRate + "%";

    document.getElementById("tieRate").textContent =
        s.tieCount || 0;

    document.getElementById("betCount").textContent =
        data.betCount;

    document.getElementById("analysisCount").textContent =
        s.totalAnalysis;

    document.getElementById("streak").textContent =
        s.streakResult
        ? `${s.streakResult === "B" ? "莊" : "閒"} ${s.streakCount} 連`
        : "-";

    const alerts =
        document.getElementById("alerts");

    alerts.innerHTML = "";

    if(s.alerts && s.alerts.length){

        s.alerts.forEach(a=>{

            const div =
                document.createElement("div");

            div.className =
                "alert-box";

            div.textContent =
                a;

            alerts.appendChild(div);

        });

    }else{

        alerts.innerHTML =
            `<div class="sub">目前無明顯提醒</div>`;

    }

}

async function manualAdd(result){

    const platform =
        document.getElementById("platform").value;

    const table =
        document.getElementById("table").value;

    await fetch("/api/manual",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            platform,
            table,
            result
        })

    });

    loadData();
}

function addCard(num){

    if(cards.length >= 6){
        return;
    }

    cards.push(num);

    updatePreview();
}

function updatePreview(){

    const preview =
        document.getElementById("cardPreview");

    preview.innerHTML = "";

    cards.forEach((n,i)=>{

        const wrap =
            document.createElement("div");

        wrap.className =
            "preview-wrap";

        if(i % 2 === 0){

            wrap.classList.add("preview-player");

        }else{

            wrap.classList.add("preview-banker");

        }

        const numBox =
            document.createElement("div");

        numBox.className =
            "preview-number";

        numBox.textContent =
            n;

        const label =
            document.createElement("div");

        label.className =
            "preview-label";

        if(i % 2 === 0){

            label.textContent =
                `閒${Math.floor(i/2)+1}`;

        }else{

            label.textContent =
                `莊${Math.floor(i/2)+1}`;

        }

        wrap.appendChild(numBox);

        wrap.appendChild(label);

        preview.appendChild(wrap);

    });

}

function resetCards(){

    cards = [];

    updatePreview();
}

async function submitCards(){

    if(cards.length < 4){

        alert("最少4張");

        return;
    }

    const platform =
        document.getElementById("platform").value;

    const table =
        document.getElementById("table").value;

    const res =
        await fetch("/api/cards",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                platform,
                table,
                cards
            })

        });

    const data =
        await res.json();

    if(!data.ok){

        alert("牌型錯誤");

        return;
    }

    resetCards();

    loadData();
}

async function undo(){

    const platform =
        document.getElementById("platform").value;

    const table =
        document.getElementById("table").value;

    await fetch("/api/undo",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            platform,
            table
        })

    });

    loadData();
}

async function clearTable(){

    if(!confirm("確定清除此桌？")){
        return;
    }

    const platform =
        document.getElementById("platform").value;

    const table =
        document.getElementById("table").value;

    await fetch("/api/clear",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            platform,
            table
        })

    });

    loadData();
}

changeViewMode();
loadTables();

</script>

</body>
</html>
