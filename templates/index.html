<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百家樂 AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial,"Microsoft JhengHei";
}

.topbar{
    background:#0b1728;
    padding:10px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

select,
input,
button{
    border:none;
    border-radius:8px;
    padding:10px;
    background:#10243d;
    color:white;
    font-size:14px;
}

button{
    cursor:pointer;
    font-weight:bold;
}

.btn-b{
    background:#8f1024;
}

.btn-p{
    background:#144f9c;
}

.btn-t{
    background:#1f8f58;
}

.btn-yellow{
    background:#9c7b14;
}

.main{
    padding:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:10px;
}

.card{
    background:#0d1b2d;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.card-title{
    font-size:12px;
    color:#8cbcff;
}

.card-value{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.red{color:#ff5a6e}
.blue{color:#59a9ff}
.green{color:#00ff9d}
.yellow{color:#ffd86b}

.predict{
    background:#0d1b2d;
    border-radius:12px;
    padding:15px;
    text-align:center;
    margin-bottom:10px;
}

.predict-main{
    font-size:42px;
    font-weight:bold;
    margin:10px 0;
}

.road{
    display:grid;
    grid-template-rows:repeat(6,22px);
    grid-auto-flow:column;
    grid-auto-columns:22px;
    gap:3px;
    overflow-x:auto;
    background:#08111d;
    border-radius:10px;
    padding:8px;
}

.cell{
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:bold;
}

.B{
    border:1px solid #ff3151;
    color:#ff3151;
}

.P{
    border:1px solid #2f8bff;
    color:#2f8bff;
}

.T{
    border:1px solid #00d26a;
    color:#00d26a;
}

.manual-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.cards-input{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
}

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .topbar{
        padding:8px;
    }

    select,
    input,
    button{
        font-size:12px;
        padding:8px;
    }

    .predict-main{
        font-size:30px;
    }

    .road{
        grid-template-rows:repeat(6,18px);
        grid-auto-columns:18px;
        gap:2px;
    }

    .cell{
        width:16px;
        height:16px;
        font-size:8px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <select id="platformSelect" onchange="changePlatform()">
        <option value="DG">DG</option>
        <option value="MT">MT</option>
    </select>

    <select id="tableSelect" onchange="loadData()"></select>

    <button class="btn-yellow" onclick="undoRecord()">
        撤回
    </button>

    <button class="btn-yellow" onclick="clearTable()">
        清除此桌
    </button>

</div>

<div class="main">

    <div class="stats">

        <div class="card">
            <div class="card-title">AI 建議</div>
            <div id="suggestText" class="card-value yellow">
                觀望
            </div>
        </div>

        <div class="card">
            <div class="card-title">信心度</div>
            <div id="stableRate" class="card-value green">
                0%
            </div>
        </div>

        <div class="card">
            <div class="card-title">莊率</div>
            <div id="bankerRate" class="card-value red">
                0%
            </div>
        </div>

        <div class="card">
            <div class="card-title">閒率</div>
            <div id="playerRate" class="card-value blue">
                0%
            </div>
        </div>

    </div>

    <div class="predict">

        <div>AI 即時預測</div>

        <div id="predictMain" class="predict-main yellow">
            觀望
        </div>

        <div id="alertText"></div>

    </div>

    <div id="road" class="road"></div>

    <div class="manual-buttons">

        <button
            class="btn-b"
            onclick="addManual('B')"
        >
            手動莊
        </button>

        <button
            class="btn-p"
            onclick="addManual('P')"
        >
            手動閒
        </button>

        <button
            class="btn-t"
            onclick="addManual('T')"
        >
            手動和
        </button>

    </div>

    <div class="cards-input">

        <input
            id="cardsInput"
            placeholder="輸入牌型 0.2.8.0"
        >

        <button
            class="btn-yellow"
            onclick="submitCards()"
        >
            送出牌型
        </button>

    </div>

</div>

<script>

let currentPlatform = "DG";
let currentTable = "";

async function loadTables(){

    const res =
        await fetch(`/api/tables?platform=${currentPlatform}`);

    const tables =
        await res.json();

    const select =
        document.getElementById("tableSelect");

    select.innerHTML = "";

    tables.forEach(t=>{

        const op =
            document.createElement("option");

        op.value = t;
        op.textContent = t;

        select.appendChild(op);
    });

    currentTable = tables[0];

    loadData();
}

function changePlatform(){

    currentPlatform =
        document.getElementById("platformSelect").value;

    loadTables();
}

async function loadData(){

    currentTable =
        document.getElementById("tableSelect").value;

    const res =
        await fetch(`/api/data?platform=${currentPlatform}&table=${currentTable}`);

    const data =
        await res.json();

    if(!data.ok){
        return;
    }

    renderRoad(data.records || []);

    const stats = data.stats || {};

    document.getElementById("suggestText").textContent =
        stats.suggest || "觀望";

    document.getElementById("predictMain").textContent =
        stats.suggest || "觀望";

    document.getElementById("stableRate").textContent =
        (stats.stableRate || 0) + "%";

    document.getElementById("bankerRate").textContent =
        (stats.bankerRate || 0) + "%";

    document.getElementById("playerRate").textContent =
        (stats.playerRate || 0) + "%";

    document.getElementById("alertText").textContent =
        (stats.alerts || []).join(" / ");
}

function renderRoad(records){

    const road =
        document.getElementById("road");

    road.innerHTML = "";

    records.forEach(r=>{

        const div =
            document.createElement("div");

        div.className =
            `cell ${r.result}`;

        div.textContent =
            r.result === "B"
            ? "莊"
            : r.result === "P"
            ? "閒"
            : "和";

        road.appendChild(div);
    });
}

async function addManual(result){

    const res = await fetch("/api/manual",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform: currentPlatform,
            table: currentTable,
            result: result
        })
    });

    const data = await res.json();

    if(!data.ok){
        alert(data.msg || "新增失敗");
        return;
    }

    loadData();
}

async function submitCards(){

    const raw =
        document.getElementById("cardsInput").value.trim();

    if(!raw){
        return;
    }

    const cards =
        raw
        .split(".")
        .filter(x => x !== "")
        .map(x => parseInt(x));

    if(cards.some(isNaN)){
        alert("格式錯誤");
        return;
    }

    const res = await fetch("/api/cards",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform: currentPlatform,
            table: currentTable,
            cards: cards
        })
    });

    const data = await res.json();

    if(!data.ok){
        alert(data.msg || "輸入失敗");
        return;
    }

    document.getElementById("cardsInput").value = "";

    loadData();
}

async function undoRecord(){

    await fetch("/api/undo",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform: currentPlatform,
            table: currentTable
        })
    });

    loadData();
}

async function clearTable(){

    if(!confirm("確定清除此桌？"))
        return;

    await fetch("/api/clear",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform: currentPlatform,
            table: currentTable
        })
    });

    loadData();
}

loadTables();

setInterval(loadData,3000);

</script>

</body>
</html>
