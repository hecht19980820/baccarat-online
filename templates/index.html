<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百家樂 AI 系統</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:radial-gradient(circle at top,#10264d,#030812 60%,#01030a);
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}
.container{max-width:1350px;margin:auto;padding:14px}
.topbar{display:grid;grid-template-columns:150px 150px 1fr;gap:12px;margin-bottom:12px}
select,button{
    border:1px solid #146ab0;
    background:#07182f;
    color:white;
    border-radius:14px;
    padding:13px;
    font-size:18px;
    font-weight:bold;
}
.expire{color:#ffd84d;font-weight:bold;padding:13px}
.grid-top{display:grid;grid-template-columns:300px 1fr 300px;gap:14px}
.grid-mid{display:grid;grid-template-columns:1fr 360px;gap:14px;margin-top:14px}
.card{
    background:rgba(3,16,34,.94);
    border:1px solid #0b72b7;
    border-radius:18px;
    padding:16px;
    box-shadow:0 0 20px rgba(0,120,255,.22);
}
.title{font-size:24px;color:#9edcff;font-weight:bold;margin-bottom:14px}
.ai-result{text-align:center;font-size:100px;font-weight:bold;text-shadow:0 0 25px currentColor}
.banker-text{color:#ff405e}.player-text{color:#147dff}.wait-text{color:#ff9fd2}
.rate{text-align:center;font-size:48px;color:#ff6f91;font-weight:bold}
.road{
    display:grid;
    grid-template-rows:repeat(6,48px);
    grid-auto-flow:column;
    grid-auto-columns:48px;
    gap:6px;
    overflow-x:auto;
    padding:8px;
    min-height:320px;
    background:rgba(255,255,255,.035);
    border-radius:14px;
}
.cell{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:bold;
}
.B{background:#9b001d;border:2px solid #ff3b57}
.P{background:#003eaf;border:2px solid #2d85ff}
.T{background:#007a46;border:2px solid #00d986}
.alert-box{
    padding:16px;border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04);
    margin-bottom:12px;font-size:19px;color:#ffd84d;
}
.help{
    border:1px solid rgba(80,170,255,.3);
    border-radius:14px;
    padding:14px;
    color:#b8d7ff;
    line-height:1.8;
    font-size:17px;
}
.card-preview{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap}
.preview-wrap{text-align:center}
.preview-number{
    width:54px;height:54px;border-radius:10px;
    border:2px solid #247ee8;
    display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:bold;
}
.preview-label{margin-top:5px;color:#9edcff;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.keypad button{height:62px;font-size:26px}
.manual-buttons{display:grid;gap:16px}
.manual-buttons button{height:74px;font-size:28px}
.banker{background:linear-gradient(135deg,#8c0025,#e60042)}
.player{background:linear-gradient(135deg,#0034b8,#006dff)}
.tie{background:linear-gradient(135deg,#006b3c,#00b86b)}
.warn{background:linear-gradient(135deg,#a57400,#e2ad00)}
.danger{background:linear-gradient(135deg,#5a001b,#cc0044)}
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.stat{
    background:rgba(3,16,34,.94);
    border:1px solid #0b72b7;
    border-radius:16px;
    padding:15px;
}
.stat-title{color:#9edcff;font-size:16px}
.stat-value{margin-top:8px;font-size:34px;font-weight:bold}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bottom button{height:66px;font-size:24px}
.footer{
    margin-top:14px;padding:13px;border:1px solid #0b72b7;border-radius:14px;
    color:#8eb6df;display:flex;justify-content:space-between;
}
@media(max-width:900px){
    .container{padding:10px}
    .topbar{grid-template-columns:1fr 1fr}
    .expire{grid-column:1/3;font-size:14px}
    .grid-top,.grid-mid{grid-template-columns:1fr}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .ai-result{font-size:70px}
    .rate{font-size:38px}
    .road{grid-template-rows:repeat(6,36px);grid-auto-columns:36px;min-height:235px}
    .cell{width:32px;height:32px;font-size:15px}
}
</style>
</head>

<body>
<div class="container">

    <div class="topbar">
        <select id="platform" onchange="loadTables()">
            <option value="DG">DG</option>
            <option value="MT">MT</option>
        </select>

        <select id="table" onchange="loadData()"></select>

        <div class="expire">會員到期時間：<span id="memberExpire">-</span></div>
    </div>

    <div class="grid-top">
        <div class="card">
            <div class="title">✦ AI 建議方向</div>
            <div id="suggest" class="ai-result wait-text">觀望</div>
            <div class="rate"><span id="stableRate">0</span>%</div>
        </div>

        <div class="card">
            <div class="title">⚙ 大路盤</div>
            <div id="road" class="road"></div>
        </div>

        <div class="card">
            <div class="title">🔔 AI 提醒</div>
            <div id="alerts"></div>
        </div>
    </div>

    <div class="grid-mid">
        <div class="card">
            <div class="title">牌型輸入</div>
            <div class="help">
                輸入順序：
                <b style="color:#2d85ff">閒1</b> →
                <b style="color:#ff3b57">莊1</b> →
                <b style="color:#2d85ff">閒2</b> →
                <b style="color:#ff3b57">莊2</b> →
                第5張 → 第6張<br>
                第5、第6張由系統依百家樂補牌規則自動判斷。
            </div>

            <div id="cardPreview" class="card-preview"></div>

            <div class="keypad">
                <button onclick="addCard(1)">1</button>
                <button onclick="addCard(2)">2</button>
                <button onclick="addCard(3)">3</button>
                <button onclick="addCard(4)">4</button>
