<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baccarat AI</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial;
    padding:20px;
}

button{
    padding:12px 20px;
    margin:5px;
    font-size:20px;
}

#road{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:20px;
}

.cell{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.B{
    background:red;
}

.P{
    background:blue;
}

.T{
    background:green;
}
</style>
</head>

<body>

<h1>Baccarat AI System</h1>

<button onclick="manual('B')">莊</button>
<button onclick="manual('P')">閒</button>
<button onclick="manual('T')">和</button>

<button onclick="undo()">撤回</button>
<button onclick="clearRoad()">清除</button>

<div id="road"></div>

<script>

async function load(){

    const res = await fetch("/api/data?platform=DG&table=RB01");
    const data = await res.json();

    const road = document.getElementById("road");

    road.innerHTML = "";

    data.records.forEach(r=>{

        const div = document.createElement("div");

        div.className = "cell " + r.result;

        div.innerText =
            r.result==="B" ? "莊" :
            r.result==="P" ? "閒" : "和";

        road.appendChild(div);

    });

}

async function manual(result){

    await fetch("/api/manual",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform:"DG",
            table:"RB01",
            result:result
        })
    });

    load();

}

async function undo(){

    await fetch("/api/undo",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform:"DG",
            table:"RB01"
        })
    });

    load();

}

async function clearRoad(){

    await fetch("/api/clear",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            platform:"DG",
            table:"RB01"
        })
    });

    load();

}

load();

</script>

</body>
</html>
