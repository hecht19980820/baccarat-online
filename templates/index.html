<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百家樂 AI 系統</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:radial-gradient(circle at top,#102b55,#020713 65%,#000);
    color:#fff;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

html{
    overflow-y:scroll;
}

.container{
    max-width:1450px;
    margin:auto;
    padding:14px;
}

.topbar{
    display:grid;
    grid-template-columns:150px 150px 150px 1fr 180px;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
}

select,button{
    border:none;
    outline:none;
    border-radius:14px;
    background:#07182f;
    border:1px solid #1679c8;
    color:white;
    padding:11px;
    font-size:16px;
    font-weight:bold;
}

.expire{color:#ffd84d;font-weight:bold;font-size:15px}
.time{text-align:right;color:#ddd;font-size:14px}

.card{
    background:rgba(3,16,34,.94);
    border:1px solid #0b72b7;
    border-radius:18px;
    padding:12px;
    box-shadow:0 0 18px rgba(0,120,255,.22);
}

.grid-top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.grid-mid{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:12px;
    margin-top:12px;
}

.title{
    font-size:18px;
    color:#9edcff;
    font-weight:bold;
    margin-bottom:8px;
}

.ai-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    align-items:center;

    min-height:160px;
    max-height:160px;
}

.ai-result{
    text-align:center;
    font-size:52px;
    font-weight:bold;
    text-shadow:0 0 20px currentColor;
}

.banker-text{color:#ff405e}
.player-text{color:#147dff}
.wait-text{color:#ff9fd2}

.rate{
    text-align:center;
    font-size:28px;
    color:#ff6f91;
    font-weight:bold;
}

.road{
    display:grid;
    grid-template-rows:repeat(6,32px);
    grid-auto-flow:column;
    grid-auto-columns:32px;
    gap:4px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:6px;

    height:210px;
    min-height:210px;
    max-height:210px;

    background:rgba(255,255,255,.045);
    border-radius:14px;
}

.cell{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.B{background:rgba(180,0,32,.9);border:2px solid #ff3b57}
.P{background:rgba(0,55,180,.9);border:2px solid #2d85ff}
.T{background:rgba(0,140,78,.9);border:2px solid #00d986}

.alert-box{
    padding:10px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04);
    font-size:15px;
    color:#ffd84d;
}

.input-layout{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:12px;
    align-items:start;
}

.help{
    border:1px solid rgba(80,170,255,.3);
    border-radius:14px;
    padding:10px;
    color:#b8d7ff;
    line-height:1.5;
    font-size:14px;
}

.card-preview{
    display:flex;
    gap:6px;
    margin:8px 0;
    flex-wrap:nowrap;

    height:56px;

    overflow:hidden;
    align-items:flex-start;
}
.preview-wrap{
    text-align:center;
    width:36px;
    flex-shrink:0;
}

.preview-number{
    width:32px;
    height:32px;
    border-radius:8px;
    border:2px solid #247ee8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:bold;
}

.preview-label{
    margin-top:4px;
    color:#9edcff;
    font-size:12px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.keypad button{
    height:52px;
    font-size:22px;
}

.manual-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.manual-buttons button{
    height:46px;
    font-size:20px;
}

.banker{background:linear-gradient(135deg,#8c0025,#e60042)}
.player{background:linear-gradient(135deg,#0034b8,#006dff)}
.tie{background:linear-gradient(135deg,#006b3c,#00b86b)}
.warn{background:linear-gradient(135deg,#a57400,#e2ad00)}
.danger{background:linear-gradient(135deg,#5a001b,#cc0044)}

.stats-row{
    display:none;
}
.stat{
    background:rgba(3,16,34,.94);
    border:1px solid #0b72b7;
    border-radius:14px;
    padding:10px;
}

.stat-title{
    color:#9edcff;
    font-size:14px;
}

.stat-value{
    margin-top:6px;
    font-size:26px;
    font-weight:bold;
}

.bottom{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-top:12px;
}

.bottom button{
    height:52px;
    font-size:20px;
}

.footer{
    margin-top:12px;
    padding:10px;
    border:1px solid #0b72b7;
    border-radius:14px;
    color:#8eb6df;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

body.force-mobile .grid-top,
body.force-mobile .grid-mid,
body.force-mobile .input-layout{
    grid-template-columns:1fr !important;
}

body.force-mobile .stats-row{
    grid-template-columns:repeat(2,1fr) !important;
}

body.force-desktop .grid-top{
    grid-template-columns:1fr 1fr !important;
}

body.force-desktop .grid-mid{
    grid-template-columns:1fr 380px !important;
}

body.force-desktop .input-layout{
    grid-template-columns:1fr 320px !important;
}

body.force-desktop .stats-row{
    grid-template-columns:repeat(6,1fr) !important;
}

@media(max-width:900px){

    .container{
        padding:8px;
    }

    .topbar{
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-bottom:10px;
    }

    .expire,
    .time{
        grid-column:1/3;
        text-align:left;
        font-size:13px;
    }

    select,button{
        padding:9px;
        font-size:15px;
        border-radius:12px;
    }

    .grid-top,
.grid-mid,
.input-layout{
    grid-template-columns:1fr;
    gap:10px;
    align-items:start;
}

    .card{
        padding:8px;
        border-radius:14px;
    }

    .title{
        font-size:15px;
        margin-bottom:6px;
    }

    .ai-row{
        grid-template-columns:1fr 1fr;
        gap:8px;
        min-height:110px;
    }

    .ai-result{
        font-size:28px;
        line-height:1.1;
    }

    .rate{
        font-size:18px;
    }

    .alert-box{
        padding:8px;
        font-size:13px;
    }

    .road{
    grid-template-rows:repeat(6,20px);
    grid-auto-columns:20px;
    gap:2px;

    overflow-x:auto;
    overflow-y:hidden;

    height:140px;
    min-height:140px;
    max-height:140px;

    padding:5px;
}

    .cell{
        width:18px;
        height:18px;
        font-size:9px;
    }

    .help{
    font-size:12px;
    padding:8px;
    line-height:1.35;
}

.card-preview{
    height:50px;
    min-height:50px;
    max-height:50px;

    gap:4px;
    margin:4px 0;
}

.preview-number{
    width:28px;
    height:28px;
    font-size:14px;
}
    .preview-label{
    font-size:8px;
}

    .keypad{
        gap:6px;
    }

    .keypad button{
        height:42px;
        font-size:20px;
    }

    .manual-buttons{
        grid-template-columns:repeat(4,1fr);
        gap:6px;
    }

    .manual-buttons button{
        height:40px;
        font-size:18px;
    }

    .stats-row{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
        margin-top:10px;
    }

    .stat{
        padding:8px;
        min-height:76px;
    }

    .stat-title{
        font-size:12px;
    }

    .stat-value{
        font-size:20px;
    }

    .bottom button{
        height:46px;
        font-size:18px;
    }

    .footer{
        font-size:11px;
        padding:8px;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="topbar">
        <select id="platform" onchange="loadTables()">
            <option value="DG">DG</option>
            <option value="MT">MT</option>
        </select>

        <select id="viewMode" onchange="changeViewMode()">
            <option value="auto">自動版</option>
            <option value="mobile">手機版</option>
            <option value="desktop">電腦版</option>
        </select>

        <select id="table" onchange="loadData()"></select>

        <div class="expire">會員到期時間：<span id="memberExpire">-</span></div>
        <div class="time">更新時間：<span id="updateTime">-</span></div>
    </div>

    <div class="grid-top">
        <div class="card">
            <div class="ai-row">
                <div>
                    <div class="title">AI 建議方向</div>
                    <div class="ai-result wait-text" id="aiResult">觀望</div>
                    <div class="rate" id="confidence">0%</div>
                </div>

                <div>
                    <div class="title">AI 提醒</div>
                    <div class="alert-box" id="aiAlert">目前無提醒</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="title">⚙ 大路盤</div>
            <div id="road" class="road"></div>
        </div>
    </div>

    <div class="grid-mid">
        <div class="card">
            <div class="title">牌型輸入</div>

            <div class="input-layout">
                <div>
                <div style="min-height:90px;">
                    
                    <div class="help">
                        輸入順序：
                        <b style="color:#2d85ff">閒1</b> →
                        <b style="color:#ff3b57">莊1</b> →
                        <b style="color:#2d85ff">閒2</b> →
                        <b style="color:#ff3b57">莊2</b> →
                        第5張 → 第6張<br>
                        第5、第6張由系統依百家樂補牌規則自動判斷。
                    </div>

                    <div id="cardPreview" class="card-preview"></div>
                    
                    </div>
                </div>

                <div>
                    <div class="keypad">
                        <button onclick="addCard(1)">1</button>
                        <button onclick="addCard(2)">2</button>
                        <button onclick="addCard(3)">3</button>
                        <button onclick="addCard(4)">4</button>
                        <button onclick="addCard(5)">5</button>
                        <button onclick="addCard(6)">6</button>
                        <button onclick="addCard(7)">7</button>
                        <button onclick="addCard(8)">8</button>
                        <button onclick="addCard(9)">9</button>
                        <button class="warn" onclick="resetCards()">清除</button>
                        <button onclick="addCard(0)">0</button>
                        <button class="banker" onclick="submitCards()">送出</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="title">♠ 手動加入大路結果</div>

            <div class="manual-buttons">
                <button class="banker" onclick="manualAdd('B')">莊</button>
                <button class="player" onclick="manualAdd('P')">閒</button>
                <button class="tie" onclick="manualAdd('T')">和</button>
                <button class="warn" onclick="undo()">↩</button>
            </div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat"><div class="stat-title">莊勝率</div><div id="bankerRate" class="stat-value banker-text">0%</div></div>
        <div class="stat"><div class="stat-title">閒勝率</div><div id="playerRate" class="stat-value player-text">0%</div></div>
        <div class="stat"><div class="stat-title">和局數</div><div id="tieCount" class="stat-value" style="color:#00d986">0</div></div>
        <div class="stat"><div class="stat-title">連續狀態</div><div id="streak" class="stat-value banker-text">-</div></div>
        <div class="stat"><div class="stat-title">下注次數</div><div id="betCount" class="stat-value">0</div></div>
        <div class="stat"><div class="stat-title">分析量</div><div id="analysisCount" class="stat-value">0</div></div>
    </div>

    <div class="bottom">
        <button class="danger" onclick="clearTable()">🗑 清除此桌資料</button>
    </div>

    <div class="footer">
        <div>♠ 百家樂 AI 輔助分析系統</div>
        <div>Ver 2.1.1</div>
    </div>

</div>

<script>
let cards = [];

function changeViewMode(){
    const mode = document.getElementById("viewMode").value;

    document.body.classList.remove("force-mobile","force-desktop");

    if(mode === "mobile"){
        document.body.classList.add("force-mobile");
    }

    if(mode === "desktop"){
        document.body.classList.add("force-desktop");
    }
}

function resultText(r){
    if(r==="B") return "莊";
    if(r==="P") return "閒";
    return "和";
}

function setTime(){
    const d = new Date();
    document.getElementById("updateTime").textContent =
        d.toLocaleTimeString("zh-TW",{hour12:false});
}

async function loadTables(){
    const platform = document.getElementById("platform").value;
    const res = await fetch(`/api/tables?platform=${platform}`);
    const tables = await res.json();

    const table = document.getElementById("table");
    table.innerHTML = "";

    tables.forEach(t=>{
        const op = document.createElement("option");
        op.value = t;
        op.textContent = t;
        table.appendChild(op);
    });

    await loadData();
}

async function loadData(){
    const platform = document.getElementById("platform").value;
    const table = document.getElementById("table").value || "RB01";

    const res = await fetch(`/api/data?platform=${platform}&table=${table}`);
    const data = await res.json();

    if(!data.ok){
        location.href="/login";
        return;
    }

    document.getElementById("memberExpire").textContent = data.memberExpireTime || "-";
    renderRoad(data.records || []);
    renderStats(data);
    setTime();
}

function renderRoad(records){
    const road = document.getElementById("road");
    road.innerHTML = "";

    records.forEach(r=>{
        const div = document.createElement("div");
        div.className = `cell ${r.result}`;
        div.textContent = resultText(r.result);
        road.appendChild(div);
    });
}

function renderStats(data){
    const s = data.stats || {};

    const aiResult = document.getElementById("aiResult");
    const confidence = document.getElementById("confidence");
    const aiAlert = document.getElementById("aiAlert");

    const suggestText = s.suggest || "觀望";

    aiResult.textContent = suggestText;
    aiResult.className = "ai-result";

    if(suggestText === "莊"){
        aiResult.classList.add("banker-text");
    }else if(suggestText === "閒"){
        aiResult.classList.add("player-text");
    }else{
        aiResult.classList.add("wait-text");
    }

    confidence.textContent = (s.stableRate || 0) + "%";

    if(s.alerts && s.alerts.length){
        aiAlert.textContent = s.alerts[0];
    }else{
        aiAlert.textContent = "目前無提醒";
    }

    document.getElementById("bankerRate").textContent = (s.bankerRate || 0) + "%";
    document.getElementById("playerRate").textContent = (s.playerRate || 0) + "%";
    document.getElementById("tieCount").textContent = s.tieCount || 0;
    document.getElementById("betCount").textContent = data.betCount || 0;
    document.getElementById("analysisCount").textContent = s.totalAnalysis || 0;

    document.getElementById("streak").textContent =
        s.streakResult ? `${resultText(s.streakResult)} ${s.streakCount}連` : "-";
}

function addCard(num){
    if(cards.length >= 6) return;
    cards.push(num);
    updatePreview();
}

function updatePreview(){
    const preview = document.getElementById("cardPreview");
    preview.innerHTML = "";

    const labels = ["閒1","莊1","閒2","莊2","第5張","第6張"];

    cards.forEach((c,i)=>{
        const wrap = document.createElement("div");
        wrap.className = "preview-wrap";

        const box = document.createElement("div");
        box.className = "preview-number";
        box.textContent = c;

        const label = document.createElement("div");
        label.className = "preview-label";
        label.textContent = labels[i];

        wrap.appendChild(box);
        wrap.appendChild(label);
        preview.appendChild(wrap);
    });
}

function resetCards(){
    cards = [];
    updatePreview();
}

async function manualAdd(result){
    const platform = document.getElementById("platform").value;
    const table = document.getElementById("table").value || "RB01";

    const res = await fetch("/api/manual",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table,result})
    });

    const data = await res.json();

    if(!data.ok){
        alert(data.msg || "新增失敗");
        return;
    }

    await loadData();
}

async function submitCards(){
    if(cards.length < 4){
        alert("最少4張");
        return;
    }

    const platform = document.getElementById("platform").value;
    const table = document.getElementById("table").value || "RB01";

    const res = await fetch("/api/cards",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table,cards})
    });

    const data = await res.json();

    if(!data.ok){
        alert(data.msg || "送出失敗");
        return;
    }

    resetCards();
    await loadData();
}

async function undo(){
    const platform = document.getElementById("platform").value;
    const table = document.getElementById("table").value || "RB01";

    await fetch("/api/undo",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table})
    });

    await loadData();
}

async function clearTable(){
    if(!confirm("確定清除此桌資料？")) return;

    const platform = document.getElementById("platform").value;
    const table = document.getElementById("table").value || "RB01";

    await fetch("/api/clear",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table})
    });

    await loadData();
}

changeViewMode();
loadTables();
setInterval(loadData,3000);
</script>

</body>
</html>
