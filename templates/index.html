<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百家樂 AI 輔助分析系統</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020814;
    --panel:#071426;
    --line:#0a7cff;
    --line2:#1a3d68;
    --blue:#0b7cff;
    --red:#ff174f;
    --green:#00b85c;
    --yellow:#ffd21f;
    --pink:#ff4db8;
    --text:#dcecff;
}

html,body{
    min-height:100%;
    background:
    radial-gradient(circle at top,#092340 0%,#020814 45%,#000 100%);
    font-family:Arial,'Microsoft JhengHei',sans-serif;
    color:white;
}

body{
    padding:10px;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1180px;
    margin:auto;
}

.card{
    background:linear-gradient(180deg,#071426,#030b16);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:
    0 0 25px rgba(0,132,255,.18),
    inset 0 0 20px rgba(0,132,255,.05);
    padding:14px;
    margin-bottom:12px;
}

.card-title{
    font-size:28px;
    font-weight:900;
    color:#d8ebff;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
}

.card-title:before{
    content:'♠';
    color:#b9dcff;
}

/* top */

.topbar{
    display:grid;
    grid-template-columns:160px 160px 1fr 160px 200px;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
}

.select-wrap{
    position:relative;
    height:54px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#07192d,#030914);
    box-shadow:0 0 12px rgba(0,132,255,.18);
}

.select-wrap:before{
    content:'♠';
    position:absolute;
    left:14px;
    top:11px;
    font-size:22px;
    color:#9cc9ff;
}

.select-wrap.mode:before{
    content:'🖥';
}

.select-wrap select{
    width:100%;
    height:100%;
    background:transparent;
    border:0;
    color:white;
    font-size:24px;
    font-weight:900;
    padding-left:48px;
    padding-right:40px;
    appearance:none;
    outline:none;
}

.select-wrap:after{
    content:'⌄';
    position:absolute;
    right:14px;
    top:8px;
    color:white;
    font-size:28px;
}

.expire{
    color:var(--yellow);
    font-size:19px;
    font-weight:900;
    white-space:nowrap;
}

.update{
    text-align:right;
    font-size:17px;
    color:#dcecff;
    white-space:nowrap;
}

/* AI */

.main-ai{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:220px;
    padding:20px;
}

.ai-left{
    border-right:1px solid rgba(255,255,255,.15);
    padding-right:18px;
}

.ai-right{
    padding-left:18px;
}

.ai-big{
    text-align:center;
    font-size:88px;
    color:var(--pink);
    font-weight:1000;
    margin-top:10px;
    text-shadow:
    0 0 18px rgba(255,77,184,.7),
    0 0 35px rgba(255,77,184,.25);
}

.ai-rate{
    text-align:center;
    font-size:42px;
    color:var(--pink);
    font-weight:900;
}

.alert-box{
    height:120px;
    border-radius:12px;
    border:1px solid #274563;
    background:linear-gradient(180deg,#08192b,#030b15);
    display:flex;
    align-items:center;
    padding:20px;
    color:var(--yellow);
    font-size:28px;
    font-weight:900;
    margin-top:20px;
}

/* road */

.road-grid{
    width:100%;
    height:300px;
    border:1px solid #24405c;
    border-radius:10px;
    overflow-x:auto;
    overflow-y:hidden;

    display:grid;
    grid-template-rows:repeat(6,1fr);
    grid-auto-flow:column;
    grid-auto-columns:52px;

    background:#04101e;
}

.road-slot{
    border-right:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:center;
}

.road-chip{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:900;
    background:#061426;
}

.road-chip.B{
    border:2px solid var(--red);
    color:#ffb3c3;
}

.road-chip.P{
    border:2px solid var(--blue);
    color:#98c8ff;
}

.road-chip.T{
    border:2px solid var(--green);
    color:#95ffbf;
}

.road-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:12px;
    margin-top:12px;
}

.action-btn{
    height:58px;
    border-radius:10px;
    border:1px solid #2e4d6d;
    font-size:34px;
    font-weight:900;
    color:white;
    cursor:pointer;
}

.red{
    background:linear-gradient(180deg,#bf0035,#77001d);
}

.blue{
    background:linear-gradient(180deg,#0059d8,#00337a);
}

.green{
    background:linear-gradient(180deg,#009448,#005f2e);
}

.undo{
    background:linear-gradient(180deg,#13253a,#09121f);
}

/* cards */

.card-input-inner{
    border:1px solid #23405d;
    border-radius:10px;
    padding:16px;
    background:#04101d;
}

.current-title{
    color:#a8c6e7;
    font-size:18px;
    margin-bottom:10px;
}

.current-cards{
    display:grid;
    grid-template-columns:repeat(6,60px);
    gap:12px;
}

.current-card{
    height:60px;
    border-radius:10px;
    border:1px solid #325273;
    background:#071426;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
}

.minmax{
    margin-top:10px;
    text-align:center;
    color:#c6d9ef;
    font-size:18px;
}

.sequence{
    margin:14px 0;
    color:#dcecff;
    font-size:20px;
}

.sequence b:nth-child(1),
.sequence b:nth-child(3){
    color:#0b7cff;
}

.sequence b:nth-child(2),
.sequence b:nth-child(4){
    color:#ff174f;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.key{
    height:58px;
    border-radius:10px;
    border:1px solid #355578;
    background:linear-gradient(180deg,#122033,#08111f);
    color:white;
    font-size:30px;
    font-weight:900;
}

.key.clear{
    background:linear-gradient(180deg,#bc8500,#725000);
}

.key.submit{
    background:linear-gradient(180deg,#d10038,#7a001f);
}

/* mobile */

@media(max-width:760px){

    .app{
        max-width:410px;
    }

    .topbar{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .expire{
        grid-column:1/3;
        font-size:16px;
    }

    .update{
        grid-column:1/3;
        text-align:left;
        font-size:15px;
    }

    .select-wrap{
        height:48px;
    }

    .select-wrap select{
        font-size:22px;
    }

    .main-ai{
        grid-template-columns:1fr 1fr;
        min-height:160px;
        padding:12px;
    }

    .ai-big{
        font-size:60px;
    }

    .ai-rate{
        font-size:28px;
    }

    .alert-box{
        height:80px;
        font-size:18px;
        padding:12px;
        margin-top:10px;
    }

    .road-grid{
        height:220px;
        grid-auto-columns:46px;
    }

    .road-chip{
        width:32px;
        height:32px;
        font-size:18px;
    }

    .action-btn{
        height:48px;
        font-size:26px;
    }

    .current-cards{
        grid-template-columns:repeat(6,1fr);
        gap:8px;
    }

    .current-card{
        height:44px;
        font-size:22px;
    }

    .sequence{
        font-size:15px;
        white-space:nowrap;
    }

    .keypad{
        gap:7px;
    }

    .key{
        height:42px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">

    <div class="select-wrap">
        <select id="platform" onchange="changePlatform()">
            <option value="DG">DG</option>
            <option value="MT">MT</option>
        </select>
    </div>

    <div class="select-wrap">
        <select id="table" onchange="loadData()"></select>
    </div>

    <div class="expire">
        會員到期：<span id="memberExpire">-</span>
    </div>

    <div class="select-wrap mode">
        <select id="viewMode" onchange="setViewMode(this.value)">
            <option value="desktop">電腦版</option>
            <option value="mobile">手機版</option>
        </select>
    </div>

    <div class="update">
        ⟳ 更新時間 <span id="updateTime">--:--:--</span>
    </div>

</div>

<div class="card main-ai">

    <div class="ai-left">
        <div class="card-title">AI 建議方向</div>
        <div class="ai-big" id="aiSuggest">觀望</div>
        <div class="ai-rate" id="aiRate">0%</div>
    </div>

    <div class="ai-right">
        <div class="card-title">🔔 AI 提醒</div>
        <div class="alert-box" id="aiAlert">
            目前無提醒
        </div>
    </div>

</div>

<div class="card">

    <div class="card-title">大路盤</div>

    <div class="road-grid" id="roadGrid"></div>

    <div class="road-actions">
        <button class="action-btn red" onclick="manualAdd('B')">莊</button>
        <button class="action-btn blue" onclick="manualAdd('P')">閒</button>
        <button class="action-btn green" onclick="manualAdd('T')">和</button>
        <button class="action-btn undo" onclick="undoLast()">↩</button>
    </div>

</div>

<div class="card">

    <div class="card-title">牌組輸入</div>

    <div class="card-input-inner">

        <div class="current-title">目前輸入</div>

        <div class="current-cards" id="cardPreview">
            <div class="current-card"></div>
            <div class="current-card"></div>
            <div class="current-card"></div>
            <div class="current-card"></div>
            <div class="current-card"></div>
            <div class="current-card"></div>
        </div>

        <div class="minmax">最少 4 張，最多 6 張</div>

        <div class="sequence">
            輸入順序：
            <b>閒1</b> →
            <b>莊1</b> →
            <b>閒2</b> →
            <b>莊2</b> →
            第5張 →
            第6張
        </div>

        <div class="keypad">

            <button class="key" onclick="addCard(1)">1</button>
            <button class="key" onclick="addCard(2)">2</button>
            <button class="key" onclick="addCard(3)">3</button>
            <button class="key" onclick="addCard(4)">4</button>
            <button class="key" onclick="addCard(5)">5</button>
            <button class="key" onclick="addCard(6)">6</button>

            <button class="key" onclick="addCard(7)">7</button>
            <button class="key" onclick="addCard(8)">8</button>
            <button class="key" onclick="addCard(9)">9</button>
            <button class="key" onclick="addCard(0)">0</button>

            <button class="key clear" onclick="clearCards()">清除</button>
            <button class="key submit" onclick="submitCards()">送出</button>

        </div>

    </div>

</div>

</div>

<script>

let currentCards=[];

function setViewMode(mode){

    localStorage.setItem("viewMode",mode);

    if(mode==="mobile"){
        document.querySelector(".app").style.maxWidth="410px";
    }else{
        document.querySelector(".app").style.maxWidth="1180px";
    }
}

async function changePlatform(){

    const platform=document.getElementById("platform").value;

    const r=await fetch("/api/tables?platform="+platform);

    const tables=await r.json();

    const sel=document.getElementById("table");

    sel.innerHTML="";

    tables.forEach(t=>{
        const op=document.createElement("option");
        op.value=t;
        op.textContent=t;
        sel.appendChild(op);
    });

    loadData();
}

async function loadData(){

    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value;

    if(!table)return;

    const r=await fetch(`/api/data?platform=${platform}&table=${table}`);

    const data=await r.json();

    if(!data.ok)return;

    document.getElementById("memberExpire").innerHTML=data.memberExpireTime||"-";

    document.getElementById("updateTime").innerHTML=
    new Date().toLocaleTimeString();

    renderRoad(data.records||[]);
}

function renderRoad(records){

    const box=document.getElementById("roadGrid");

    box.innerHTML="";

    const total=Math.max(72,records.length+12);

    for(let i=0;i<total;i++){

        const slot=document.createElement("div");

        slot.className="road-slot";

        if(records[i]){

            const chip=document.createElement("div");

            chip.className="road-chip "+records[i].result;

            chip.innerHTML=records[i].result;

            slot.appendChild(chip);
        }

        box.appendChild(slot);
    }
}

async function manualAdd(result){

    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value;

    await fetch("/api/manual",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            platform,
            table,
            result
        })
    });

    loadData();
}

async function undoLast(){

    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value;

    await fetch("/api/undo",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            platform,
            table
        })
    });

    loadData();
}

function addCard(n){

    if(currentCards.length>=6)return;

    currentCards.push(n);

    renderCards();
}

function clearCards(){

    currentCards=[];

    renderCards();
}

function renderCards(){

    const cells=document.querySelectorAll(".current-card");

    cells.forEach((c,i)=>{
        c.innerHTML=currentCards[i]||"";
    });
}

async function submitCards(){

    if(currentCards.length<4){
        alert("最少4張");
        return;
    }

    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value;

    await fetch("/api/cards",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            platform,
            table,
            cards:currentCards
        })
    });

    clearCards();

    loadData();
}

const mode=localStorage.getItem("viewMode")||"desktop";

document.getElementById("viewMode").value=mode;

setViewMode(mode);

changePlatform();

setInterval(loadData,5000);

</script>

</body>
</html>
