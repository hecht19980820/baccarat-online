<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baccarat AI</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial;padding:20px}
button,select{padding:12px;margin:5px;font-size:18px}
#road{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.cell{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.B{background:red}.P{background:blue}.T{background:green}
</style>
</head>
<body>

<h1>Baccarat AI System</h1>

<select id="platform" onchange="loadTables()">
<option value="DG">DG</option>
<option value="MT">MT</option>
</select>

<select id="table" onchange="load()"></select>

<br>

<button onclick="manual('B')">莊</button>
<button onclick="manual('P')">閒</button>
<button onclick="manual('T')">和</button>
<button onclick="undo()">撤回</button>
<button onclick="clearRoad()">清除</button>

<div id="road"></div>

<script>
async function loadTables(){
    const platform=document.getElementById("platform").value;
    const res=await fetch(`/api/tables?platform=${platform}`);
    const tables=await res.json();
    const table=document.getElementById("table");
    table.innerHTML="";
    tables.forEach(t=>{
        const op=document.createElement("option");
        op.value=t;
        op.textContent=t;
        table.appendChild(op);
    });
    load();
}

async function load(){
    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value || "RB01";

    const res=await fetch(`/api/data?platform=${platform}&table=${table}`);
    const data=await res.json();

    if(!data.ok){
        location.href="/login";
        return;
    }

    const road=document.getElementById("road");
    road.innerHTML="";

    data.records.forEach(r=>{
        const div=document.createElement("div");
        div.className="cell "+r.result;
        div.innerText=r.result==="B"?"莊":r.result==="P"?"閒":"和";
        road.appendChild(div);
    });
}

async function manual(result){
    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value || "RB01";

    await fetch("/api/manual",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table,result})
    });
    load();
}

async function undo(){
    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value || "RB01";

    await fetch("/api/undo",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table})
    });
    load();
}

async function clearRoad(){
    const platform=document.getElementById("platform").value;
    const table=document.getElementById("table").value || "RB01";

    await fetch("/api/clear",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({platform,table})
    });
    load();
}

loadTables();
</script>

</body>
</html>
