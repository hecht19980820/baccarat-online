<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 管理員後台</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050914;
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:230px;
    background:#071225;
    border-right:1px solid rgba(90,170,255,.35);
    padding:20px;
}

.logo{
    font-size:22px;
    color:#9dccff;
    font-weight:bold;
    margin-bottom:30px;
}

.menu{
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    margin-bottom:12px;
}

.main{
    margin-left:230px;
    padding:20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logout{
    color:#ffd86b;
    text-decoration:none;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:20px;
}

.card{
    background:rgba(8,18,38,.88);
    border:1px solid rgba(90,170,255,.42);
    border-radius:16px;
    padding:18px;
    box-shadow:0 0 18px rgba(0,120,255,.14);
}

.card-title{
    color:#9dccff;
    font-size:15px;
}

.card-value{
    font-size:34px;
    font-weight:bold;
    margin-top:10px;
}

.table-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.table-box{
    background:rgba(8,18,38,.88);
    border:1px solid rgba(90,170,255,.42);
    border-radius:16px;
    padding:16px;
}

.table-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    color:#9dccff;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:12px;
}

.stat{
    background:rgba(255,255,255,.04);
    padding:10px;
    border-radius:10px;
    font-size:13px;
}

.road{
    display:grid;
    grid-template-rows:repeat(6,24px);
    grid-auto-flow:column;
    grid-auto-columns:24px;
    gap:3px;
    overflow-x:auto;
    padding:6px;
    background:rgba(255,255,255,.03);
    border-radius:10px;
}

.cell{
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:10px;
    font-weight:bold;
}

.B{border:1px solid #ff3151;color:#ff3151}
.P{border:1px solid #2f8bff;color:#2f8bff}
.T{border:1px solid #00d26a;color:#00d26a}

.alert{
    color:#ffd86b;
    font-size:13px;
    margin-top:8px;
}

@media(max-width:900px){
    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .cards,
    .table-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">AI 管理後台</div>
    <div class="menu">全桌監控</div>
    <div class="menu">AI 權重分析</div>
    <div class="menu">會員管理</div>
    <div class="menu">系統設定</div>
</div>

<div class="main">

    <div class="top">
        <h1>全桌數據中心</h1>
        <a class="logout" href="/logout">登出</a>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-title">總局數</div>
            <div id="totalRounds" class="card-value">0</div>
        </div>

        <div class="card">
            <div class="card-title">總下注次數</div>
            <div id="totalBets" class="card-value">0</div>
        </div>

        <div class="card">
            <div class="card-title">會員到期</div>
            <div id="memberExpire" class="card-value" style="font-size:18px;">-</div>
        </div>

        <div class="card">
            <div class="card-title">系統狀態</div>
            <div class="card-value" style="color:#00d26a;">運行中</div>
        </div>
    </div>

    <div id="tableGrid" class="table-grid"></div>

</div>

<script>
async function loadAdminData(){
    const res = await fetch("/api/admin-data");
    const data = await res.json();

    if(!data.ok){
        location.href = "/admin-login";
        return;
    }

    document.getElementById("totalRounds").textContent = data.totalRounds;
    document.getElementById("totalBets").textContent = data.totalBets;
    document.getElementById("memberExpire").textContent = data.memberExpireTime;

    const grid = document.getElementById("tableGrid");
    grid.innerHTML = "";

    data.tables.forEach(t=>{
        const box = document.createElement("div");
        box.className = "table-box";

        let roadHtml = "";

        t.records.forEach(r=>{
            roadHtml += `<div class="cell ${r.result}">${r.result === "B" ? "莊" : r.result === "P" ? "閒" : "和"}</div>`;
        });

        let alertText = "-";
        if(t.alerts && t.alerts.length){
            alertText = t.alerts.join(" / ");
        }

        box.innerHTML = `
            <div class="table-head">
                <div>${t.platform} - ${t.table}</div>
                <div>建議：${t.suggest} ${t.stableRate}%</div>
            </div>

            <div class="stats">
                <div class="stat">局數<br>${t.rounds}</div>
                <div class="stat">下注<br>${t.betCount}</div>
                <div class="stat">莊率<br>${t.bankerRate}%</div>
                <div class="stat">閒率<br>${t.playerRate}%</div>
            </div>

            <div class="road">${roadHtml}</div>

            <div class="alert">提醒：${alertText}</div>
            <div class="alert">AI權重：莊 ${t.bankerScore} / 閒 ${t.playerScore}</div>
        `;

        grid.appendChild(box);
    });
}

loadAdminData();
setInterval(loadAdminData, 5000);
</script>

</body>
</html>
