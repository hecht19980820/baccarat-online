<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 控制中心</title>

<style>

body{
    margin:0;
    background:#020817;
    color:white;
    font-family:sans-serif;
}

.wrap{
    padding:20px;
}

.title{
    font-size:38px;
    font-weight:bold;
    margin-bottom:20px;
}

.card{
    background:#071226;
    border:1px solid #16345f;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-top:10px;
    margin-bottom:10px;
    border-radius:12px;
    border:none;
    background:#0b1730;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#2563eb,#38bdf8);
    color:white;
    font-size:18px;
    font-weight:bold;
}

.member{
    background:#08101f;
    border:1px solid #1b3357;
    border-radius:16px;
    padding:15px;
    margin-top:15px;
}

.row{
    margin-top:5px;
    color:#cbd5e1;
}

.status-on{
    color:#22c55e;
    font-weight:bold;
}

.status-off{
    color:#ef4444;
    font-weight:bold;
}

.small-btn{
    margin-top:12px;
    background:#ef4444;
    padding:10px;
    font-size:15px;
}

.enable-btn{
    background:#22c55e;
}

.logout{
    position:fixed;
    top:20px;
    right:20px;
    color:#ffd54f;
    text-decoration:none;
    font-size:20px;
}

</style>
</head>

<body>

<a class="logout" href="/logout">登出</a>

<div class="wrap">

<div class="title">
AI 百家樂控制中心
</div>

<div class="card">

<h2>新增會員</h2>

<input id="username" placeholder="帳號">

<input id="password" placeholder="密碼">

<input id="expire" placeholder="到期時間 2026-12-31 23:59:59">

<button onclick="createMember()">
新增會員
</button>

</div>

<div class="card">

<h2>會員列表</h2>

<div id="memberList">
讀取中...
</div>

</div>

</div>

<script>

async function loadMembers(){

    let r = await fetch("/api/admin/members")
    let data = await r.json()

    if(!data.ok){
        document.getElementById("memberList").innerHTML = "讀取失敗"
        return
    }

    let html = ""

    data.members.forEach(m=>{

        html += `
        <div class="member">

            <div class="row">
            帳號：
            <b>${m.username}</b>
            </div>

            <div class="row">
            狀態：
            <span class="${m.enabled ? 'status-on':'status-off'}">
            ${m.enabled ? '啟用':'停權'}
            </span>
            </div>

            <div class="row">
            到期：
            ${m.expire || '-'}
            </div>

            <div class="row">
            裝置：
            ${m.device || '-'}
            </div>

            <div class="row">
            IP：
            ${m.ip || '-'}
            </div>

            <div class="row">
            所在桌：
            ${m.current_platform || '-'}
            ${m.current_table || ''}
            </div>

            <div class="row">
            最後操作：
            ${m.last_active || '-'}
            </div>

            <button
                class="small-btn ${m.enabled ? '' : 'enable-btn'}"
                onclick="toggleMember('${m.username}')"
            >
                ${m.enabled ? '停權會員':'啟用會員'}
            </button>

        </div>
        `
    })

    document.getElementById("memberList").innerHTML = html
}

async function createMember(){

    let username = document.getElementById("username").value
    let password = document.getElementById("password").value
    let expire = document.getElementById("expire").value

    let r = await fetch("/api/admin/create-member",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            password,
            expire
        })
    })

    let data = await r.json()

    alert(data.msg)

    if(data.ok){

        document.getElementById("username").value = ""
        document.getElementById("password").value = ""

        loadMembers()
    }
}

async function toggleMember(username){

    let r = await fetch("/api/admin/toggle-member",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username
        })
    })

    let data = await r.json()

    if(data.ok){
        loadMembers()
    }
}

loadMembers()

setInterval(loadMembers,5000)

</script>

</body>
</html>
