<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電影級 AI 控制中心</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
    radial-gradient(circle at top,#10234d 0%,#050914 48%,#02040a 100%);
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
    overflow-x:hidden;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;

    background:
    linear-gradient(
        180deg,
        rgba(6,16,34,.98),
        rgba(4,8,18,.98)
    );

    border-right:
    1px solid rgba(90,170,255,.28);

    padding:20px;

    z-index:50;
}

.logo{
    font-size:24px;
    color:#9dccff;
    font-weight:bold;
    margin-bottom:30px;
    text-shadow:0 0 12px rgba(80,180,255,.55);
}

.menu{
    padding:14px;
    border-radius:14px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.25s;

    background:
    rgba(255,255,255,.03);

    border:
    1px solid rgba(255,255,255,.04);
}

.menu:hover{
    transform:translateY(-2px);
    box-shadow:0 0 14px rgba(0,140,255,.25);
}

.menu.active{
    background:
    linear-gradient(
        135deg,
        #005eff,
        #00a2ff
    );

    box-shadow:
    0 0 18px rgba(0,120,255,.45);
}

.main{
    margin-left:240px;
    padding:22px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logout{
    color:#ffd86b;
    text-decoration:none;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:22px;
}

.card{
    background:
    rgba(8,18,38,.86);

    border:
    1px solid rgba(90,170,255,.28);

    border-radius:18px;

    padding:18px;

    box-shadow:
    0 0 24px rgba(0,120,255,.12),
    inset 0 0 12px rgba(255,255,255,.015);
}

.card-title{
    color:#9dccff;
    font-size:14px;
}

.card-value{
    font-size:34px;
    margin-top:10px;
    font-weight:bold;
}

.green{color:#00d26a}
.red{color:#ff4c6a}
.blue{color:#2f8bff}
.yellow{color:#ffd86b}

.section{
    display:none;
}

.section.active{
    display:block;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.panel{
    background:
    rgba(8,18,38,.88);

    border:
    1px solid rgba(90,170,255,.25);

    border-radius:18px;

    padding:16px;
}

.panel-title{
    color:#9dccff;
    font-size:20px;
    margin-bottom:14px;
    font-weight:bold;
}

.road{
    display:grid;
    grid-template-rows:repeat(6,22px);
    grid-auto-flow:column;
    grid-auto-columns:22px;
    gap:3px;
    overflow-x:auto;
    padding:8px;
}

.cell{
    width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:bold;
}

.B{
    border:1px solid #ff3151;
    color:#ff3151;
    box-shadow:0 0 8px rgba(255,0,55,.35);
}

.P{
    border:1px solid #2f8bff;
    color:#2f8bff;
    box-shadow:0 0 8px rgba(0,120,255,.35);
}

.T{
    border:1px solid #00d26a;
    color:#00d26a;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:10px;
}

.stat{
    background:
    rgba(255,255,255,.03);

    border-radius:10px;

    padding:10px;

    font-size:13px;
}

.alert{
    margin-top:10px;
    color:#ffd86b;
    font-size:13px;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:12px;
    border-bottom:
    1px solid rgba(255,255,255,.06);

    text-align:left;
    font-size:14px;
}

.table th{
    color:#9dccff;
}

.live{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 10px #00ff88;
    display:inline-block;
}

.heat{
    height:10px;
    border-radius:8px;
    overflow:hidden;
    background:rgba(255,255,255,.05);
    margin-top:8px;
}

.heat-inner{
    height:100%;
    border-radius:8px;
    background:
    linear-gradient(
        90deg,
        #005eff,
        #00ffb7,
        #ffd000,
        #ff3151
    );
}

.ai-rank{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;

    background:
    rgba(255,255,255,.03);
}

.chart{
    height:180px;
    border-radius:16px;

    background:
    linear-gradient(
        180deg,
        rgba(0,140,255,.08),
        rgba(255,255,255,.01)
    );

    position:relative;
    overflow:hidden;
}

.wave{
    position:absolute;
    width:200%;
    height:200%;
    left:-50%;
    top:-50%;

    background:
    radial-gradient(
        circle,
        rgba(0,160,255,.28),
        transparent 60%
    );

    animation:wave 5s linear infinite;
}

@keyframes wave{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@media(max-width:1000px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .cards,
    .grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        AI 控制中心
    </div>

    <div class="menu active" onclick="showSection('dashboard',this)">
        即時總覽
    </div>

    <div class="menu" onclick="showSection('online',this)">
        在線會員
    </div>

    <div class="menu" onclick="showSection('history',this)">
        AI 歷史分析
    </div>

    <div class="menu" onclick="showSection('learning',this)">
        AI 即時學習
    </div>

</div>

<div class="main">

    <div class="top">
        <h1>電影級 AI 百家樂控制中心</h1>

        <a class="logout" href="/logout">
            登出
        </a>
    </div>

    <div class="cards">

        <div class="card">
            <div class="card-title">總在線會員</div>
            <div id="onlineCount" class="card-value green">0</div>
        </div>

        <div class="card">
            <div class="card-title">目前 AI 偏向</div>
            <div id="globalBias" class="card-value red">莊</div>
        </div>

        <div class="card">
            <div class="card-title">最穩桌</div>
            <div id="bestTable" class="card-value blue">-</div>
        </div>

        <div class="card">
            <div class="card-title">熱桌</div>
            <div id="hotTable" class="card-value yellow">-</div>
        </div>

        <div class="card">
            <div class="card-title">AI 今日準確率</div>
            <div id="todayAcc" class="card-value green">91%</div>
        </div>

    </div>

    <!-- 即時總覽 -->
    <div id="dashboard" class="section active">

        <div id="tableGrid" class="grid"></div>

    </div>

    <!-- 在線會員 -->
    <div id="online" class="section">

        <div class="panel">

            <div class="panel-title">
                即時在線會員
            </div>

            <table class="table">

                <thead>
                    <tr>
                        <th>狀態</th>
                        <th>會員</th>
                        <th>所在桌</th>
                        <th>最後操作</th>
                        <th>IP</th>
                        <th>裝置</th>
                    </tr>
                </thead>

                <tbody id="onlineBody"></tbody>

            </table>

        </div>

    </div>

    <!-- AI歷史 -->
    <div id="history" class="section">

        <div class="grid">

            <div class="panel">

                <div class="panel-title">
                    AI 歷史勝率
                </div>

                <div class="ai-rank">
                    <span>今日</span>
                    <span class="green">91%</span>
                </div>

                <div class="ai-rank">
                    <span>昨日</span>
                    <span class="blue">88%</span>
                </div>

                <div class="ai-rank">
                    <span>近7天</span>
                    <span class="yellow">86%</span>
                </div>

                <div class="ai-rank">
                    <span>最準桌</span>
                    <span class="green">DG-RB02</span>
                </div>

                <div class="ai-rank">
                    <span>最差桌</span>
                    <span class="red">MT-03A</span>
                </div>

            </div>

            <div class="panel">

                <div class="panel-title">
                    AI 波動圖
                </div>

                <div class="chart">
                    <div class="wave"></div>
                </div>

            </div>

        </div>

    </div>

    <!-- AI學習 -->
    <div id="learning" class="section">

        <div class="grid">

            <div class="panel">

                <div class="panel-title">
                    AI 即時學習中心
                </div>

                <div class="ai-rank">
                    <span>目前偏莊</span>
                    <span class="red">73%</span>
                </div>

                <div class="heat">
                    <div class="heat-inner" style="width:73%"></div>
                </div>

                <br>

                <div class="ai-rank">
                    <span>目前偏閒</span>
                    <span class="blue">27%</span>
                </div>

                <div class="heat">
                    <div class="heat-inner" style="width:27%"></div>
                </div>

            </div>

            <div class="panel">

                <div class="panel-title">
                    AI 勝率排行
                </div>

                <div class="ai-rank">
                    <span>1. DG-RB02</span>
                    <span class="green">93%</span>
                </div>

                <div class="ai-rank">
                    <span>2. DG-RB05</span>
                    <span class="green">91%</span>
                </div>

                <div class="ai-rank">
                    <span>3. MT-01</span>
                    <span class="yellow">88%</span>
                </div>

                <div class="ai-rank">
                    <span>4. MT-03A</span>
                    <span class="red">61%</span>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

function showSection(id,el){

    document.querySelectorAll(".section")
    .forEach(s=>s.classList.remove("active"));

    document.querySelectorAll(".menu")
    .forEach(m=>m.classList.remove("active"));

    document.getElementById(id)
    .classList.add("active");

    el.classList.add("active");
}

async function loadAdminData(){

    const res = await fetch("/api/admin-data");
    const data = await res.json();

    if(!data.ok){
        location.href="/admin-login";
        return;
    }

    renderTables(data.tables);

    document.getElementById("onlineCount")
    .textContent = data.members.length;

    if(data.tables.length){

        const best = [...data.tables]
        .sort((a,b)=>b.stableRate-a.stableRate)[0];

        document.getElementById("bestTable")
        .textContent = `${best.platform}-${best.table}`;

        const hot = [...data.tables]
        .sort((a,b)=>b.rounds-a.rounds)[0];

        document.getElementById("hotTable")
        .textContent = `${hot.platform}-${hot.table}`;

        let bankerBias = 0;
        let playerBias = 0;

        data.tables.forEach(t=>{
            bankerBias += t.bankerScore;
            playerBias += t.playerScore;
        });

        document.getElementById("globalBias")
        .textContent =
            bankerBias > playerBias
            ? "莊"
            : "閒";
    }

    renderOnline(data.members);
}

function renderOnline(members){

    const body = document.getElementById("onlineBody");
    body.innerHTML = "";

    members.forEach(m=>{

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td><span class="live"></span></td>
            <td>${m.username}</td>
            <td>DG-RB01</td>
            <td>${m.lastLogin || "-"}</td>
            <td>127.0.0.1</td>
            <td>Windows / Mobile</td>
        `;

        body.appendChild(tr);
    });
}

function renderTables(tables){

    const grid = document.getElementById("tableGrid");
    grid.innerHTML = "";

    tables.forEach(t=>{

        const box = document.createElement("div");
        box.className = "panel";

        let roadHtml = "";

        t.records.forEach(r=>{

            roadHtml += `
            <div class="cell ${r.result}">
                ${
                    r.result==="B"
                    ?"莊"
                    :r.result==="P"
                    ?"閒"
                    :"和"
                }
            </div>
            `;
        });

        let streak =
            t.streakResult
            ?`${t.streakResult==="B"?"莊":"閒"} ${t.streakCount}連`
            :"-";

        box.innerHTML = `
            <div class="panel-title">
                ${t.platform}-${t.table}
            </div>

            <div class="stats">

                <div class="stat">
                    AI建議<br>
                    ${t.suggest}
                </div>

                <div class="stat">
                    穩定率<br>
                    ${t.stableRate}%
                </div>

                <div class="stat">
                    連續<br>
                    ${streak}
                </div>

                <div class="stat">
                    局數<br>
                    ${t.rounds}
                </div>

            </div>

            <div class="road">
                ${roadHtml}
            </div>

            <div class="alert">
                ${
                    t.alerts && t.alerts.length
                    ? t.alerts.join(" / ")
                    : "目前無提醒"
                }
            </div>
        `;

        grid.appendChild(box);
    });
}

loadAdminData();

setInterval(loadAdminData,3000);

</script>

</body>
</html>
