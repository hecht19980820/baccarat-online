<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 管理控制中心</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#12284b 0%,#07111f 45%,#01040a 100%);
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:10px;
}

.top-title{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.25);

    border-radius:18px;

    padding:18px;

    margin-bottom:10px;

    box-shadow:
        0 0 25px rgba(0,120,255,.15),
        inset 0 0 12px rgba(255,255,255,.03);
}

.top-title h1{
    margin:0;
    font-size:34px;
    color:#7fd5ff;
}

.top-title p{
    margin-top:8px;
    color:#9dccff;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:10px;
}

.card{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.22);

    border-radius:16px;

    padding:14px;

    box-shadow:
        0 0 18px rgba(0,120,255,.12),
        inset 0 0 12px rgba(255,255,255,.03);
}

.card-title{
    color:#9dccff;
    font-size:14px;
}

.card-value{
    margin-top:10px;
    font-size:36px;
    font-weight:bold;
}

.red{color:#ff4763}
.blue{color:#4aa3ff}
.green{color:#00ff9d}
.yellow{color:#ffd86b}

.panel{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.22);

    border-radius:16px;

    padding:14px;

    margin-bottom:10px;

    box-shadow:
        0 0 18px rgba(0,120,255,.12),
        inset 0 0 12px rgba(255,255,255,.03);
}

.panel-title{
    font-size:22px;
    color:#9dccff;
    margin-bottom:12px;
    font-weight:bold;
}

.monitor-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.monitor{

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.05);

    border-radius:14px;

    padding:10px;
}

.monitor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.monitor-title{
    font-size:20px;
    font-weight:bold;
}

.monitor-rate{
    color:#ffd86b;
    font-size:18px;
    font-weight:bold;
}

.road{
    display:grid;

    grid-template-rows:repeat(6,20px);

    grid-auto-flow:column;

    grid-auto-columns:20px;

    gap:2px;

    overflow-x:auto;

    padding:5px;

    border-radius:10px;

    background:rgba(255,255,255,.03);

    min-height:130px;
}

.cell{
    width:18px;
    height:18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:8px;
    font-weight:bold;
}

.B{
    border:1px solid #ff3151;
    color:#ff3151;
}

.P{
    border:1px solid #2f8bff;
    color:#2f8bff;
}

.T{
    border:1px solid #00d26a;
    color:#00d26a;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:left;
    font-size:13px;
}

.table th{
    color:#9dccff;
}

input,
button{
    border:none;
    outline:none;
    border-radius:10px;
    padding:10px;
    background:#08162d;
    border:1px solid rgba(90,170,255,.35);
    color:white;
    font-weight:bold;
}

button{
    cursor:pointer;
}

.btn-blue{
    background:linear-gradient(135deg,#005eff,#00a2ff);
}

.btn-red{
    background:linear-gradient(135deg,#7a001f,#d60045);
}

.btn-yellow{
    background:linear-gradient(135deg,#8d6200,#d39b00);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:12px;
}

.action-row{
    display:flex;
    gap:6px;
}

.online{
    color:#00ff9d;
    font-weight:bold;
}

.offline{
    color:#ff637a;
    font-weight:bold;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .monitor-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

    .card-value{
        font-size:24px;
    }

    .top-title h1{
        font-size:24px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="top-title">
<h1>AI 管理控制中心</h1>
<p>Baccarat AI Admin Dashboard</p>
</div>

<div class="cards">

<div class="card">
<div class="card-title">總桌數</div>
<div id="totalTables" class="card-value blue">0</div>
</div>

<div class="card">
<div class="card-title">總局數</div>
<div id="totalRounds" class="card-value green">0</div>
</div>

<div class="card">
<div class="card-title">在線會員</div>
<div id="onlineCount" class="card-value yellow">0</div>
</div>

<div class="card">
<div class="card-title">AI 今日準確率</div>
<div id="todayAcc" class="card-value red">72%</div>
</div>

</div>

<div class="panel">

<div class="panel-title">
AI 即時桌況監控
</div>

<div id="tableGrid" class="monitor-grid"></div>

</div>

<div class="panel">

<div class="panel-title">
會員管理
</div>

<div class="form-grid">

<input id="newUsername" placeholder="會員帳號">

<input id="newPassword" placeholder="會員密碼">

<input id="newExpire" type="datetime-local">

<button class="btn-blue" onclick="addMember()">
新增會員
</button>

</div>

<table class="table">

<thead>

<tr>
<th>帳號</th>
<th>密碼</th>
<th>到期</th>
<th>狀態</th>
<th>桌號</th>
<th>裝置</th>
<th>IP</th>
<th>最後操作</th>
<th>操作</th>
</tr>

</thead>

<tbody id="memberList"></tbody>

</table>

</div>

<div class="panel">

<div class="panel-title">
系統操作
</div>

<div class="action-row">

<button class="btn-yellow" onclick="loadAdminData()">
重新整理
</button>

<button class="btn-red" onclick="clearAllTables()">
清除全部桌資料
</button>

<button class="btn-blue" onclick="location.href='/'">
返回會員頁
</button>

</div>

</div>

</div>

<script>

async function loadAdminData(){

    const res =
        await fetch("/api/admin-data");

    const data =
        await res.json();

    if(!data.ok){
        location.href="/admin-login";
        return;
    }

    document.getElementById("totalTables").textContent =
        data.totalTables || 0;

    document.getElementById("totalRounds").textContent =
        data.totalRounds || 0;

    document.getElementById("onlineCount").textContent =
        data.onlineCount || 0;

    document.getElementById("todayAcc").textContent =
        (data.aiAccuracy?.today || 0) + "%";

    renderTables(data.tables || []);

    renderMembers(data.members || []);
}

function renderTables(tables){

    const grid =
        document.getElementById("tableGrid");

    grid.innerHTML = "";

    tables.forEach(t=>{

        const div =
            document.createElement("div");

        div.className = "monitor";

        let roadHtml = "";

        (t.records || []).forEach(r=>{

            roadHtml += `
                <div class="cell ${r.result}">
                    ${
                        r.result === "B"
                        ? "莊"
                        : r.result === "P"
                        ? "閒"
                        : "和"
                    }
                </div>
            `;
        });

        div.innerHTML = `

            <div class="monitor-head">

                <div class="monitor-title">
                    ${t.platform}-${t.table}
                </div>

                <div class="monitor-rate">
                    ${t.suggest} ${t.stableRate}%
                </div>

            </div>

            <div style="margin-bottom:8px;">
                莊率 ${t.bankerRate}%　
                閒率 ${t.playerRate}%　
                和 ${t.tieCount}
            </div>

            <div class="road">
                ${roadHtml}
            </div>

            <div style="margin-top:10px;">

                <button
                    class="btn-red"
                    onclick="clearTable('${t.platform}','${t.table}')"
                >
                    清除此桌
                </button>

            </div>
        `;

        grid.appendChild(div);
    });
}

function renderMembers(members){

    const tbody =
        document.getElementById("memberList");

    tbody.innerHTML = "";

    members.forEach(m=>{

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${m.username}</td>

            <td>
                <input
                    id="pw_${m.id}"
                    value="${m.password}"
                >
            </td>

            <td>
                <input
                    type="datetime-local"
                    id="ex_${m.id}"
                    value="${(m.expire || '').replace(' ','T')}"
                >
            </td>

            <td>
                ${
                    m.enabled
                    ? '<span class="online">啟用</span>'
                    : '<span class="offline">停權</span>'
                }
            </td>

            <td>
                ${m.currentPlatform || "-"}-${m.currentTable || "-"}
            </td>

            <td>${m.device || "-"}</td>

            <td>${m.ip || "-"}</td>

            <td>${m.lastActive || "-"}</td>

            <td>

                <div class="action-row">

                    <button
                        class="btn-blue"
                        onclick="updateMember(${m.id})"
                    >
                        儲存
                    </button>

                    <button
                        class="btn-yellow"
                        onclick="toggleMember(${m.id})"
                    >
                        ${m.enabled ? "停權" : "啟用"}
                    </button>

                    <button
                        class="btn-red"
                        onclick="deleteMember(${m.id})"
                    >
                        刪除
                    </button>

                </div>

            </td>
        `;

        tbody.appendChild(tr);
    });
}

async function addMember(){

    const username =
        document.getElementById("newUsername").value.trim();

    const password =
        document.getElementById("newPassword").value.trim();

    let expire =
        document.getElementById("newExpire").value.trim();

    if(!username || !password || !expire){

        alert("請填寫完整");

        return;
    }

    expire =
        expire.replace("T"," ") + ":00";

    const res =
        await fetch("/api/admin/member/add",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password,
                expire
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "新增失敗");

        return;
    }

    alert("新增成功");

    document.getElementById("newUsername").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("newExpire").value = "";

    loadAdminData();
}

async function updateMember(id){

    const password =
        document.getElementById(`pw_${id}`).value.trim();

    let expire =
        document.getElementById(`ex_${id}`).value.trim();

    expire =
        expire.replace("T"," ") + ":00";

    const res =
        await fetch("/api/admin/member/update",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                id,
                password,
                expire
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert("修改失敗");

        return;
    }

    alert("已儲存");

    loadAdminData();
}

async function toggleMember(id){

    await fetch("/api/admin/member/toggle",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({id})
    });

    loadAdminData();
}

async function deleteMember(id){

    if(!confirm("確定刪除會員？"))
        return;

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/admin/member/delete",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                id,
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

async function clearTable(platform,table){

    if(!confirm(`確定清除 ${platform}-${table}？`))
        return;

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/clear",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                platform,
                table,
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

async function clearAllTables(){

    if(!confirm("確定清除全部桌資料？"))
        return;

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/admin/clear-all",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

loadAdminData();

setInterval(loadAdminData,3000);

</script>

</body>
</html>
