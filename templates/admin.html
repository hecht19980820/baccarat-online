<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 管理控制中心</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#12284b 0%,#07111f 45%,#01040a 100%);
    color:white;
    font-family:Arial,"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1700px;
    margin:auto;
    padding:10px;
}

.topbar{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.25);

    border-radius:18px;

    padding:18px;

    margin-bottom:10px;

    box-shadow:
        0 0 25px rgba(0,120,255,.15),
        inset 0 0 12px rgba(255,255,255,.03);
}

.top-title{
    font-size:34px;
    color:#7fd5ff;
    font-weight:bold;
}

.top-sub{
    margin-top:6px;
    color:#9dccff;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:10px;
}

.stat-card{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.22);

    border-radius:16px;

    padding:14px;

    box-shadow:
        0 0 18px rgba(0,120,255,.12),
        inset 0 0 12px rgba(255,255,255,.03);
}

.stat-title{
    color:#9dccff;
    font-size:14px;
}

.stat-value{
    margin-top:10px;
    font-size:34px;
    font-weight:bold;
}

.red{color:#ff4763}
.blue{color:#4aa3ff}
.green{color:#00ff9d}
.yellow{color:#ffd86b}

.panel{

    background:rgba(5,16,34,.92);

    border:1px solid rgba(0,180,255,.22);

    border-radius:16px;

    padding:14px;

    margin-bottom:10px;

    box-shadow:
        0 0 18px rgba(0,120,255,.12),
        inset 0 0 12px rgba(255,255,255,.03);
}

.panel-title{
    font-size:24px;
    color:#9dccff;
    font-weight:bold;
    margin-bottom:14px;
}

.monitor-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.monitor{

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.05);

    border-radius:14px;

    padding:10px;

    position:relative;

    overflow:hidden;
}

.monitor.hot{
    box-shadow:
        0 0 18px rgba(255,80,120,.55);
}

.monitor.cold{
    opacity:.65;
}

.glow{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );
    animation:glowMove 3s linear infinite;
}

@keyframes glowMove{
    from{
        transform:translateX(-100%);
    }
    to{
        transform:translateX(100%);
    }
}

.monitor-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.monitor-title{
    font-size:22px;
    font-weight:bold;
}

.monitor-ai{
    font-size:18px;
    color:#ffd86b;
    font-weight:bold;
}

.road{
    display:grid;

    grid-template-rows:repeat(6,20px);

    grid-auto-flow:column;

    grid-auto-columns:20px;

    gap:2px;

    overflow-x:auto;

    padding:5px;

    border-radius:10px;

    background:rgba(255,255,255,.03);

    min-height:130px;
}

.cell{
    width:18px;
    height:18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:8px;
    font-weight:bold;
}

.B{
    border:1px solid #ff3151;
    color:#ff3151;
}

.P{
    border:1px solid #2f8bff;
    color:#2f8bff;
}

.T{
    border:1px solid #00d26a;
    color:#00d26a;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table th,
.table td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:left;
    font-size:13px;
}

.table th{
    color:#9dccff;
}

input,
button,
select{
    border:none;
    outline:none;
    border-radius:10px;
    padding:10px;
    background:#08162d;
    border:1px solid rgba(90,170,255,.35);
    color:white;
    font-weight:bold;
}

button{
    cursor:pointer;
}

.btn-blue{
    background:linear-gradient(135deg,#005eff,#00a2ff);
}

.btn-red{
    background:linear-gradient(135deg,#7a001f,#d60045);
}

.btn-yellow{
    background:linear-gradient(135deg,#8d6200,#d39b00);
}

.btn-green{
    background:linear-gradient(135deg,#006c43,#00d49a);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:14px;
}

.action-row{
    display:flex;
    gap:6px;
}

.online{
    color:#00ff9d;
    font-weight:bold;
}

.offline{
    color:#ff637a;
    font-weight:bold;
}

.ranking{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.rank-card{

    background:rgba(255,255,255,.03);

    border-radius:12px;

    padding:12px;

    border:1px solid rgba(255,255,255,.05);
}

.rank-title{
    color:#9dccff;
    font-size:14px;
}

.rank-value{
    margin-top:8px;
    font-size:26px;
    font-weight:bold;
}

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .monitor-grid{
        grid-template-columns:1fr;
    }

    .ranking{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
    }

    .top-title{
        font-size:24px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">

<div class="top-title">
AI 電影級控制中心
</div>

<div class="top-sub">
Baccarat AI Control Center
</div>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-title">在線會員</div>
<div id="onlineCount" class="stat-value green">0</div>
</div>

<div class="stat-card">
<div class="stat-title">總桌數</div>
<div id="totalTables" class="stat-value blue">0</div>
</div>

<div class="stat-card">
<div class="stat-title">總局數</div>
<div id="totalRounds" class="stat-value yellow">0</div>
</div>

<div class="stat-card">
<div class="stat-title">今日 AI</div>
<div id="todayAcc" class="stat-value red">0%</div>
</div>

<div class="stat-card">
<div class="stat-title">昨日 AI</div>
<div id="yesterdayAcc" class="stat-value blue">0%</div>
</div>

<div class="stat-card">
<div class="stat-title">近7天 AI</div>
<div id="weekAcc" class="stat-value green">0%</div>
</div>

</div>

<div class="panel">

<div class="panel-title">
AI 勝率排行榜
</div>

<div id="ranking" class="ranking"></div>

</div>

<div class="panel">

<div class="panel-title">
AI 即時桌況監控
</div>

<div id="tableGrid" class="monitor-grid"></div>

</div>

<div class="panel">

<div class="panel-title">
會員管理
</div>

<div class="form-grid">

<input id="newUsername" placeholder="會員帳號">

<input id="newPassword" placeholder="會員密碼">

<input id="newExpire" type="datetime-local">

<select id="newRole">
<option value="member">會員</option>
<option value="agent">代理</option>
</select>

<button class="btn-blue" onclick="addMember()">
新增會員
</button>

</div>

<table class="table">

<thead>

<tr>
<th>帳號</th>
<th>角色</th>
<th>密碼</th>
<th>到期</th>
<th>狀態</th>
<th>桌號</th>
<th>裝置</th>
<th>IP</th>
<th>最後操作</th>
<th>操作</th>
</tr>

</thead>

<tbody id="memberList"></tbody>

</table>

</div>

<div class="panel">

<div class="panel-title">
系統操作
</div>

<div class="action-row">

<button class="btn-yellow" onclick="loadAdminData()">
重新整理
</button>

<button class="btn-red" onclick="clearAllTables()">
清除全部桌資料
</button>

<button class="btn-green" onclick="location.href='/'">
返回會員頁
</button>

</div>

</div>

</div>

<script>

function roadHtml(records){

    let html = "";

    (records || []).forEach(r=>{

        html += `
        <div class="cell ${r.result}">
            ${
                r.result === "B"
                ? "莊"
                : r.result === "P"
                ? "閒"
                : "和"
            }
        </div>
        `;
    });

    return html;
}

async function loadAdminData(){

    const res =
        await fetch("/api/admin-data");

    const data =
        await res.json();

    if(!data.ok){

        location.href = "/admin-login";

        return;
    }

    document.getElementById("onlineCount").textContent =
        data.onlineCount || 0;

    document.getElementById("totalTables").textContent =
        data.totalTables || 0;

    document.getElementById("totalRounds").textContent =
        data.totalRounds || 0;

    document.getElementById("todayAcc").textContent =
        (data.aiAccuracy?.today || 0) + "%";

    document.getElementById("yesterdayAcc").textContent =
        (data.aiAccuracy?.yesterday || 0) + "%";

    document.getElementById("weekAcc").textContent =
        (data.aiAccuracy?.week || 0) + "%";

    renderRanking(data.ranking || []);

    renderTables(data.tables || []);

    renderMembers(data.members || []);
}

function renderRanking(list){

    const wrap =
        document.getElementById("ranking");

    wrap.innerHTML = "";

    list.forEach((r,i)=>{

        const div =
            document.createElement("div");

        div.className = "rank-card";

        div.innerHTML = `

            <div class="rank-title">
                TOP ${i+1}
            </div>

            <div style="margin-top:6px;">
                ${r.platform}-${r.table}
            </div>

            <div class="rank-value">
                ${r.aiHitRate || 0}%
            </div>

            <div style="margin-top:6px;color:#9dccff;">
                AI：${r.suggest}
            </div>
        `;

        wrap.appendChild(div);
    });
}

function renderTables(tables){

    const grid =
        document.getElementById("tableGrid");

    grid.innerHTML = "";

    tables.forEach(t=>{

        const div =
            document.createElement("div");

        div.className =
            `monitor ${t.hot ? 'hot' : ''} ${t.cold ? 'cold' : ''}`;

        div.innerHTML = `

            <div class="glow"></div>

            <div class="monitor-head">

                <div class="monitor-title">
                    ${t.platform}-${t.table}
                </div>

                <div class="monitor-ai">
                    ${t.suggest} ${t.stableRate}%
                </div>

            </div>

            <div style="margin-bottom:8px;">

                莊率 ${t.bankerRate}%　
                閒率 ${t.playerRate}%　
                和 ${t.tieCount}

            </div>

            <div class="road">
                ${roadHtml(t.records)}
            </div>

            <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">

                <div>
                    AI命中：
                    ${t.aiHitRate || 0}%
                </div>

                <div>
                    學習局數：
                    ${t.modelRounds || 0}
                </div>

            </div>

            <div style="margin-top:10px;">

                <button
                    class="btn-red"
                    onclick="clearTable('${t.platform}','${t.table}')"
                >
                    清除此桌
                </button>

            </div>
        `;

        grid.appendChild(div);
    });
}

function renderMembers(members){

    const tbody =
        document.getElementById("memberList");

    tbody.innerHTML = "";

    members.forEach(m=>{

        const tr =
            document.createElement("tr");

        tr.innerHTML = `

            <td>${m.username}</td>

            <td>${m.role}</td>

            <td>

                <input
                    id="pw_${m.id}"
                    value="${m.password}"
                >

            </td>

            <td>

                <input
                    type="datetime-local"
                    id="ex_${m.id}"
                    value="${(m.expire || '').replace(' ','T')}"
                >

            </td>

            <td>

                ${
                    m.online
                    ? '<span class="online">在線</span>'
                    : '<span class="offline">離線</span>'
                }

            </td>

            <td>
                ${m.currentPlatform || "-"}-${m.currentTable || "-"}
            </td>

            <td>${m.device || "-"}</td>

            <td>${m.ip || "-"}</td>

            <td>${m.lastActive || "-"}</td>

            <td>

                <div class="action-row">

                    <button
                        class="btn-blue"
                        onclick="updateMember(${m.id})"
                    >
                        儲存
                    </button>

                    <button
                        class="btn-yellow"
                        onclick="toggleMember(${m.id})"
                    >
                        ${m.enabled ? "停權" : "啟用"}
                    </button>

                    <button
                        class="btn-red"
                        onclick="deleteMember(${m.id})"
                    >
                        刪除
                    </button>

                </div>

            </td>
        `;

        tbody.appendChild(tr);
    });
}

async function addMember(){

    const username =
        document.getElementById("newUsername").value.trim();

    const password =
        document.getElementById("newPassword").value.trim();

    let expire =
        document.getElementById("newExpire").value.trim();

    const role =
        document.getElementById("newRole").value;

    if(!username || !password || !expire){

        alert("請填寫完整");

        return;
    }

    expire =
        expire.replace("T"," ") + ":00";

    const res =
        await fetch("/api/admin/member/add",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password,
                expire,
                role
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "新增失敗");

        return;
    }

    alert("新增成功");

    loadAdminData();
}

async function updateMember(id){

    const password =
        document.getElementById(`pw_${id}`).value.trim();

    let expire =
        document.getElementById(`ex_${id}`).value.trim();

    expire =
        expire.replace("T"," ") + ":00";

    await fetch("/api/admin/member/update",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            id,
            password,
            expire
        })
    });

    loadAdminData();
}

async function toggleMember(id){

    await fetch("/api/admin/member/toggle",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({id})
    });

    loadAdminData();
}

async function deleteMember(id){

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/admin/member/delete",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                id,
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

async function clearTable(platform,table){

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/admin/clear-table",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                platform,
                table,
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

async function clearAllTables(){

    const adminPassword =
        prompt("請輸入管理員密碼");

    if(!adminPassword)
        return;

    const res =
        await fetch("/api/admin/clear-all",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                adminPassword
            })
        });

    const data =
        await res.json();

    if(!data.ok){

        alert(data.msg || "失敗");

        return;
    }

    loadAdminData();
}

loadAdminData();

setInterval(loadAdminData,3000);

</script>

</body>
</html>
